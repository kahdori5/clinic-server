<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ClinicFlow - Super Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>:root{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--accent:#38bdf8;--border:#334155;--muted:#94a3b8;--success:#10b981;--danger:#ef4444;}body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);margin:0;display:flex;height:100vh;}.sidebar{width:260px;background:var(--card);border-left:1px solid var(--border);padding:20px 0;}.logo{font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:40px;color:var(--text);}.logo span{color:var(--accent);}.nav-item{padding:15px 25px;color:var(--muted);cursor:pointer;}.nav-item.active{background:rgba(56,189,248,0.1);color:var(--accent);border-left:4px solid var(--accent);}.main-content{flex:1;padding:40px;overflow-y:auto;}.card-panel{background:var(--card);border-radius:20px;padding:25px;border:1px solid var(--border);}.btn{background:var(--accent);color:#0f172a;border:none;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer;font-family:inherit;}table{width:100%;border-collapse:collapse;margin-top:20px;}th,td{padding:15px;text-align:right;border-bottom:1px solid var(--border);} .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;z-index:100;}.modal-content{background:var(--card);padding:30px;border-radius:20px;width:400px;}input,select{width:100%;padding:12px;margin-bottom:15px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;}</style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Clinic<span>Flow</span><br><span style="font-size:0.8rem;color:var(--muted);">SaaS Admin</span></div>
        <div class="nav-item active">🏢 إدارة العيادات والاشتراكات</div>
    </div>
    <div class="main-content">
        <div class="card-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <h2>العيادات المشتركة</h2>
                <button class="btn" onclick="document.getElementById('addModal').style.display='flex'">+ إضافة عيادة رئيسية</button>
            </div>
            <table>
                <thead><tr><th>العيادة</th><th>الرابط</th><th>الأطباء</th><th>حالة الاشتراك</th><th>إجراءات الإدارة</th></tr></thead>
                <tbody id="clinicsTable"></tbody>
            </table>
        </div>
    </div>

    <!-- نوافذ الإضافة والتجديد -->
    <div class="modal" id="addModal"><div class="modal-content"><h2>إضافة عيادة رئيسية</h2><input type="text" id="cName" placeholder="الاسم"><input type="text" id="cSlug" placeholder="الرابط المختصر"><button class="btn" style="width:100%" onclick="addClinic()">حفظ</button><button class="btn" style="width:100%; margin-top:10px; background:var(--bg); color:var(--text);" onclick="this.parentElement.parentElement.style.display='none'">إلغاء</button></div></div>
    
    <div class="modal" id="addDocModal"><div class="modal-content"><h2>إضافة طبيب للعيادة</h2><input type="hidden" id="dParent"><input type="text" id="dName" placeholder="اسم الطبيب (مثال: د. أحمد - أسنان)"><input type="text" id="dSlug" placeholder="الرابط المختصر للطبيب"><button class="btn" style="width:100%" onclick="addDoctor()">إضافة الطبيب</button><button class="btn" style="width:100%; margin-top:10px; background:var(--bg); color:var(--text);" onclick="this.parentElement.parentElement.style.display='none'">إلغاء</button></div></div>
    
    <div class="modal" id="renewModal"><div class="modal-content"><h2>تجديد الاشتراك</h2><input type="hidden" id="rId"><select id="rMonths"><option value="1">شهر واحد</option><option value="3">3 أشهر</option><option value="6">6 أشهر</option><option value="12">سنة كاملة</option></select><button class="btn" style="width:100%" onclick="renewSub()">تأكيد التجديد</button><button class="btn" style="width:100%; margin-top:10px; background:var(--bg); color:var(--text);" onclick="this.parentElement.parentElement.style.display='none'">إلغاء</button></div></div>
    
    <div class="modal" id="linksModal"><div class="modal-content" style="width:500px;"><h2>الروابط 🔗</h2><p style="color:var(--muted); font-size:0.9rem;">الاستقبال والتلفاز للعيادة ككل:</p><a id="lRec" href="#" target="_blank" style="color:var(--accent); display:block; margin-bottom:10px;"></a><a id="lTv" href="#" target="_blank" style="color:var(--accent); display:block; margin-bottom:20px;"></a><p style="color:var(--warning); font-size:0.8rem;">ملاحظة: لكي يعمل التلفاز والاستقبال، يجب إضافة أطباء للعيادة أولاً!</p><button class="btn" style="width:100%; background:var(--bg); color:var(--text);" onclick="this.parentElement.parentElement.style.display='none'">إغلاق</button></div></div>

    <script>
        async function fetchClinics() {
            const res = await fetch('https://clinic-server-i00s.onrender.com/api/admin/clinics');
            const data = await res.json();
            const tb = document.getElementById('clinicsTable'); tb.innerHTML = '';
            data.forEach(c => {
                const daysLeft = Math.ceil((new Date(c.subscription_end) - new Date()) / (1000 * 60 * 60 * 24));
                const subHtml = daysLeft > 0 ? `<span style="color:var(--success); font-weight:bold;">متبقي ${daysLeft} يوم</span>` : `<span style="color:var(--danger); font-weight:bold;">منتهي!</span>`;
                tb.innerHTML += `<tr>
                    <td style="font-weight:bold;">${c.name}</td><td>${c.slug}</td><td>${c.doctors_count} أطباء</td><td>${subHtml}</td>
                    <td>
                        <button class="btn" style="font-size:0.8rem;" onclick="openDocModal(${c.id})">➕ طبيب</button>
                        <button class="btn" style="font-size:0.8rem; background:#f59e0b;" onclick="openRenewModal(${c.id})">💳 تجديد</button>
                        <button class="btn" style="font-size:0.8rem; background:var(--card); color:var(--accent); border:1px solid;" onclick="showLinks('${c.slug}')">🔗</button>
                        <button class="btn" style="font-size:0.8rem; background:var(--danger); color:white;" onclick="delClinic(${c.id})">🗑️</button>
                    </td></tr>`;
            });
        }
        
        async function addClinic() {
            await fetch('https://clinic-server-i00s.onrender.com/api/clinics', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:document.getElementById('cName').value, slug:document.getElementById('cSlug').value}) });
            document.getElementById('addModal').style.display='none'; fetchClinics();
        }
        
        function openDocModal(id) { document.getElementById('dParent').value = id; document.getElementById('addDocModal').style.display='flex'; }
        async function addDoctor() {
            await fetch('https://clinic-server-i00s.onrender.com/api/admin/add-doctor', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({parent_id:document.getElementById('dParent').value, name:document.getElementById('dName').value, slug:document.getElementById('dSlug').value}) });
            document.getElementById('addDocModal').style.display='none'; fetchClinics();
        }

        function openRenewModal(id) { document.getElementById('rId').value = id; document.getElementById('renewModal').style.display='flex'; }
        async function renewSub() {
            await fetch('https://clinic-server-i00s.onrender.com/api/admin/renew', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({clinic_id:document.getElementById('rId').value, months:document.getElementById('rMonths').value}) });
            document.getElementById('renewModal').style.display='none'; fetchClinics();
        }

        async function delClinic(id) {
            if(confirm('هل أنت متأكد من حذف العيادة بكافة أطبائها؟')) {
                await fetch(`https://clinic-server-i00s.onrender.com/api/admin/clinics/${id}`, {method:'DELETE'}); fetchClinics();
            }
        }

        function showLinks(slug) {
            document.getElementById('lRec').href = `https://clinic-server-i00s.onrender.com/reception.html?clinic=${slug}`; document.getElementById('lRec').innerText = `🖥️ الاستقبال`;
            document.getElementById('lTv').href = `https://clinic-server-i00s.onrender.com/tv.html?clinic=${slug}`; document.getElementById('lTv').innerText = `📺 التلفاز`;
            document.getElementById('linksModal').style.display='flex';
        }
        window.onload = fetchClinics;
    </script>
</body>
</html>
