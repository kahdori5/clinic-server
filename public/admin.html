<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow - Super Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --border: #334155; --muted: #94a3b8; --success: #10b981; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* الشريط الجانبي */
        .sidebar { width: 260px; background: var(--card); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; }
        .logo { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 40px; color: var(--text); }
        .logo span { color: var(--accent); }
        .nav-item { padding: 15px 25px; color: var(--muted); text-decoration: none; display: block; font-weight: 500; transition: 0.3s; border-right: 4px solid transparent; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: rgba(56, 189, 248, 0.1); color: var(--accent); border-color: var(--accent); }
        
        /* المحتوى الرئيسي */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header h1 { margin: 0; font-size: 2rem; }
        
        /* بطاقات الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .stat-card span { color: var(--muted); font-size: 0.95rem; margin-bottom: 10px; }
        .stat-card strong { font-size: 2.5rem; color: var(--text); line-height: 1; }
        
        /* جدول العيادات */
        .card-panel { background: var(--card); border-radius: 20px; border: 1px solid var(--border); padding: 25px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { background: var(--accent); color: #0f172a; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; font-family: inherit; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-size: 0.9rem; font-weight: 500; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .status-active { background: rgba(16, 185, 129, 0.1); color: var(--success); padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; }
        
        /* نافذة إضافة عيادة */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; width: 400px; border: 1px solid var(--border); }
        .modal-content input { width: 100%; padding: 15px; margin-bottom: 15px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 10px; box-sizing: border-box; font-family: inherit; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; font-family: inherit; }
        .btn-cancel { background: var(--bg); color: var(--text); }
        .btn-save { background: var(--accent); color: #0f172a; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">Clinic<span>Flow</span><br><span style="font-size: 0.8rem; color: var(--muted);">Super Admin</span></div>
        <div class="nav-item active">🏢 إدارة العيادات</div>
        <div class="nav-item">📊 الإحصائيات العامة</div>
        <div class="nav-item">⚙️ إعدادات النظام</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>لوحة التحكم الرئيسية</h1>
            <div style="background: var(--card); padding: 10px 20px; border-radius: 30px; border: 1px solid var(--border);">
                مرحباً بك، أيها المدير 👑
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span>إجمالي العيادات المشتركة</span>
                <strong id="totalClinics">0</strong>
            </div>
            <div class="stat-card">
                <span>المرضى اليوم (كل العيادات)</span>
                <strong id="totalPatients" style="color: var(--accent);">0</strong>
            </div>
        </div>

        <div class="card-panel">
            <div class="panel-header">
                <h2 style="margin: 0; font-size: 1.2rem;">قائمة العيادات</h2>
                <button class="btn-add" onclick="document.getElementById('addModal').style.display='flex'">+ إضافة عيادة جديدة</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>رقم</th>
                        <th>اسم العيادة</th>
                        <th>الرابط المخصص (Slug)</th>
                        <th>المرضى اليوم</th>
                        <th>الحالة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="clinicsTable">
                    <!-- سيتم جلب العيادات هنا -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة إضافة عيادة -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">إضافة عيادة جديدة</h2>
            <input type="text" id="clinicName" placeholder="اسم العيادة (مثال: عيادة الشفاء)">
            <input type="text" id="clinicSlug" placeholder="الرابط المختصر (مثال: al-shifa)">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="document.getElementById('addModal').style.display='none'">إلغاء</button>
                <button class="btn-save" onclick="addClinic()">حفظ وإنشاء</button>
            </div>
        </div>
    </div>

    <script>
        async function fetchClinics() {
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/admin/clinics');
                const clinics = await res.json();
                
                const table = document.getElementById('clinicsTable');
                table.innerHTML = '';
                
                let totalPatients = 0;

                clinics.forEach(c => {
                    totalPatients += parseInt(c.patients_today);
                    table.innerHTML += `
                        <tr>
                            <td>#${c.id}</td>
                            <td style="font-weight: bold;">${c.name}</td>
                            <td style="color: var(--muted);">${c.slug}</td>
                            <td>${c.patients_today}</td>
                            <td><span class="status-active">نشطة</span></td>
                            <td>
                                <a href="https://clinic-server-i00s.onrender.com/reception.html?clinic=${c.slug}" target="_blank" style="color: var(--accent); text-decoration: none; font-size: 0.9rem;">فتح العيادة ↗</a>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('totalClinics').innerText = clinics.length;
                document.getElementById('totalPatients').innerText = totalPatients;
            } catch (e) { console.error(e); }
        }

        async function addClinic() {
            const name = document.getElementById('clinicName').value;
            const slug = document.getElementById('clinicSlug').value;
            if(!name || !slug) return alert('يرجى تعبئة الحقول');

            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/clinics', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, slug })
                });
                if(res.ok) {
                    document.getElementById('addModal').style.display='none';
                    document.getElementById('clinicName').value = '';
                    document.getElementById('clinicSlug').value = '';
                    fetchClinics();
                } else { alert('حدث خطأ أو الرابط مستخدم مسبقاً'); }
            } catch (e) { alert('خطأ في الاتصال'); }
        }

        window.onload = fetchClinics;
    </script>
</body>
</html>
