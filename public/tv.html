<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ClinicFlow - TV Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <style>:root{--bg:#f4f7f6;--card:#ffffff;--text:#2d3748;--accent:#40757d;--border:#e2e8f0;--muted:#718096;}body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);margin:0;height:100vh;display:flex;overflow:hidden;}.controls-bar{position:absolute;top:20px;left:20px;display:flex;gap:15px;z-index:10;}.btn-sound{background:#10b981;color:white;border:none;padding:10px 15px;border-radius:12px;font-family:inherit;font-weight:bold;cursor:pointer;}.left-panel{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;}.number-box{background:var(--card);padding:50px 100px;border-radius:40px;border:1px solid var(--border);text-align:center;}.number-box h1{margin:0;font-size:3rem;opacity:0.8;}.number{font-size:15rem;font-weight:900;color:var(--accent);margin:0;line-height:1;}.right-panel{width:350px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;text-align:center;}.qr-wrapper img{width:250px;height:250px;border-radius:10px;}.overlay-paused{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.95);color:white;justify-content:center;align-items:center;font-size:4rem;z-index:1000;text-align:center;}</style>
</head>
<body>
    <div class="controls-bar"><button class="btn-sound" onclick="enableSound(this)">🔔 تفعيل الجرس</button></div>
    <div class="left-panel"><div class="number-box"><h1>الرقم الحالي</h1><div class="number" id="currentTicket">--</div></div></div>
    <div class="right-panel"><h2>اسحب تذكرتك الآن</h2><div class="qr-wrapper"><img id="qrImage" src=""></div><p>قم بتوجيه كاميرا هاتفك</p></div>
    <div class="overlay-paused" id="pausedMsg">الاستقبال مغلق مؤقتاً</div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const CLINIC_SLUG = new URLSearchParams(window.location.search).get('clinic') || 'default-clinic';
        document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://clinic-server-i00s.onrender.com/patient.html?clinic=${CLINIC_SLUG}`;
        
        let soundEnabled = false; let audioCtx;
        function playChime() {
            if(!soundEnabled) return;
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc1.frequency.value = 880; osc2.frequency.value = 1108.73;
            gain.gain.setValueAtTime(0, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
            osc1.start(); osc2.start(); osc1.stop(audioCtx.currentTime + 1.5); osc2.stop(audioCtx.currentTime + 1.5);
        }
        function enableSound(btn) { soundEnabled = true; btn.innerText = '✔️ الجرس مفعل'; btn.style.background = 'gray'; playChime(); }

        window.onload = async () => {
            const res = await fetch(`https://clinic-server-i00s.onrender.com/api/queue-status/${CLINIC_SLUG}`);
            const data = await res.json();
            document.getElementById('currentTicket').innerText = data.current_number || '--';
            if(data.status === 'paused') document.getElementById('pausedMsg').style.display = 'flex';
        };

        const socket = io('https://clinic-server-i00s.onrender.com');
        socket.on('call_patient', (data) => { if(data.clinic_slug === CLINIC_SLUG) { document.getElementById('currentTicket').innerText = data.current_number; playChime(); } });
        socket.on('queue_status_changed', (data) => { document.getElementById('pausedMsg').style.display = data.status === 'paused' ? 'flex' : 'none'; });
    </script>
</body>
</html>
