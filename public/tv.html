<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow - TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --accent: #40757d; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --border: #334155; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; transition: 0.3s; }
        .left-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .number-box { background: var(--card); padding: 50px 100px; border-radius: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); border: 1px solid var(--border); text-align: center; }
        .number { font-size: 15rem; font-weight: 900; color: var(--accent); margin: 0; line-height: 1; }
        .right-panel { width: 350px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; }
        .qr-wrapper img { width: 250px; height: 250px; border-radius: 15px; margin-bottom: 20px; }
        .controls { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; }
        select, .theme-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="controls">
        <select id="langSelect" onchange="changeLang(this.value)">
            <option value="ar">AR</option><option value="fr">FR</option><option value="en">EN</option>
        </select>
        <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    </div>
    <div class="left-panel">
        <div class="number-box">
            <h1 style="margin:0; opacity:0.8;" data-i18n="currentNum">الرقم الحالي</h1>
            <div class="number" id="currentTicket">--</div>
        </div>
    </div>
    <div class="right-panel">
        <h2 data-i18n="scanQr">اسحب تذكرتك الآن</h2>
        <div class="qr-wrapper"><img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://clinic-server-i00s.onrender.com/patient.html" alt="QR"></div>
        <p data-i18n="scanDesc" style="opacity:0.7;">قم بتوجيه كاميرا هاتفك نحو الكود لتأخذ دورك فوراً.</p>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const dict = {
            ar: { currentNum: "الرقم الحالي", scanQr: "اسحب تذكرتك الآن", scanDesc: "قم بتوجيه كاميرا هاتفك نحو الكود لتأخذ دورك فوراً." },
            fr: { currentNum: "Numéro Actuel", scanQr: "Prenez votre ticket", scanDesc: "Scannez ce code QR avec votre téléphone pour prendre votre tour." },
            en: { currentNum: "Current Number", scanQr: "Take your ticket", scanDesc: "Scan this QR code with your phone to join the queue." }
        };
        
        function changeLang(lang) {
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelect').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[lang][el.getAttribute('data-i18n')]);
        }

        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') !== 'dark';
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        window.onload = async () => {
            changeLang(localStorage.getItem('lang') || 'ar');
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/queue-status/default-clinic');
                const data = await res.json();
                document.getElementById('currentTicket').innerText = data.current_number || '--';
            } catch(e) {}
        };

        const socket = io('https://clinic-server-i00s.onrender.com');
        socket.on('call_patient', (data) => {
            const numBox = document.querySelector('.number-box');
            document.getElementById('currentTicket').innerText = data.current_number;
            numBox.style.transform = 'scale(1.05)'; setTimeout(() => numBox.style.transform = 'scale(1)', 300);
        });
    </script>
</body>
</html>
