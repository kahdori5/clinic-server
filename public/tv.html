<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة العرض - ClinicFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --accent: #10b981; --border: #e2e8f0; --warning: #f59e0b; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #10b981; --border: #334155; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: 0.3s; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; background: var(--card); padding: 15px 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .logo { font-size: 1.8rem; font-weight: 800; color: var(--accent); }
        .controls { display: flex; gap: 10px; }
        select, .theme-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 12px; cursor: pointer; font-weight: bold; outline: none; }
        
        .doctors-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .doc-card { background: var(--card); border-radius: 24px; padding: 40px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 3px solid transparent; transition: 0.3s; }
        .doc-card.active-call { border-color: var(--warning); animation: pulse 1.5s infinite; }
        
        .doc-name { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; color: var(--text); }
        .number-box { background: rgba(16, 185, 129, 0.1); color: var(--accent); font-size: 5rem; font-weight: 800; padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        .waiting { font-size: 1.2rem; color: var(--muted); font-weight: bold; }

        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); } 70% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(245, 158, 11, 0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">ClinicFlow <span style="font-size: 1.2rem; color: var(--text);" id="clinicTitle"></span></div>
        <div class="controls">
            <select id="langSelect" onchange="changeLang(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
            <button class="theme-btn" onclick="toggleTheme()" data-i18n="btnTheme">🌓 الوضع الليلي</button>
        </div>
    </div>

    <div class="doctors-grid" id="doctorsList">
        <h2 style="text-align: center; width: 100%; color: var(--muted);" data-i18n="loading">جاري تحميل البيانات...</h2>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const CLINIC_SLUG = new URLSearchParams(window.location.search).get('clinic');
        if(CLINIC_SLUG) document.getElementById('clinicTitle').innerText = `- ${CLINIC_SLUG}`;

        const dict = {
            ar: { btnTheme: "🌓 الوضع الليلي", loading: "جاري تحميل البيانات...", waiting: "في الانتظار:", empty: "لا يوجد أطباء متاحين." },
            fr: { btnTheme: "🌓 Mode Sombre", loading: "Chargement...", waiting: "En attente:", empty: "Aucun médecin." },
            en: { btnTheme: "🌓 Dark Mode", loading: "Loading...", waiting: "Waiting:", empty: "No doctors available." }
        };

        let currentLang = localStorage.getItem('tv_lang') || 'ar';
        function changeLang(lang) {
            currentLang = lang; localStorage.setItem('tv_lang', lang);
            document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelect').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[lang][el.getAttribute('data-i18n')]);
            fetchDoctors();
        }

        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') !== 'dark';
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('tv_theme', isDark ? 'dark' : 'light');
        };

        window.onload = () => {
            changeLang(currentLang);
            if(localStorage.getItem('tv_theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            fetchDoctors();
        };

        async function fetchDoctors() {
            if(!CLINIC_SLUG) return document.getElementById('doctorsList').innerHTML = `<h2 style="text-align:center;">يرجى تحديد العيادة في الرابط</h2>`;
            try {
                const res = await fetch(`https://clinic-server-i00s.onrender.com/api/clinic-doctors/${CLINIC_SLUG}`);
                const data = await res.json();
                
                if(data.length === 0) {
                    document.getElementById('doctorsList').innerHTML = `<h2 style="text-align: center; width: 100%;">${dict[currentLang].empty}</h2>`;
                    return;
                }
                
                let html = '';
                data.forEach(doc => {
                    html += `
                        <div class="doc-card" id="card-${doc.slug}">
                            <div class="doc-name">👨‍⚕️ ${doc.name}</div>
                            <div class="number-box" id="num-${doc.slug}">${doc.current === 0 ? '--' : doc.current}</div>
                            <div class="waiting">${dict[currentLang].waiting} <span id="wait-${doc.slug}">${doc.waiting}</span></div>
                        </div>
                    `;
                });
                document.getElementById('doctorsList').innerHTML = html;
            } catch (e) {
                document.getElementById('doctorsList').innerHTML = `<h2 style="text-align: center; width: 100%;">خطأ في الاتصال بالخادم</h2>`;
            }
        }

        const socket = io('https://clinic-server-i00s.onrender.com');
        
        socket.on('call_patient', (data) => {
            const card = document.getElementById(`card-${data.clinic_slug}`);
            const numEl = document.getElementById(`num-${data.clinic_slug}`);
            if(card && numEl) {
                numEl.innerText = data.current_number;
                
                // تشغيل جرس التنبيه
                const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
                audio.play().catch(e => console.log('Autoplay blocked'));
                
                // أنيميشن النبض
                card.classList.add('active-call');
                setTimeout(() => card.classList.remove('active-call'), 5000);
                fetchDoctors(); // تحديث أرقام الانتظار
            }
        });

        socket.on('new_ticket', () => { fetchDoctors(); });
    </script>
</body>
</html>
