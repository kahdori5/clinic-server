<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة العرض - ClinicFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --accent: #10b981; --border: #e2e8f0; --warning: #f59e0b; --muted: #718096; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #10b981; --border: #334155; --muted: #94a3b8; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 25px; transition: 0.3s; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; background: var(--card); padding: 20px 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); flex-wrap: wrap; gap: 20px; }
        .logo { font-size: 2.8rem; font-weight: 800; color: var(--accent); }
        .controls { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
        select, .theme-btn, .sound-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; outline: none; font-size: 1rem; font-family: inherit; transition: 0.2s; }
        .sound-btn { background: var(--accent); color: #ffffff !important; border: none; }
        .sound-btn:hover { filter: brightness(1.1); }
        
        .qr-container { display: flex; align-items: center; gap: 25px; background: rgba(16, 185, 129, 0.08); padding: 20px 35px; border-radius: 24px; border: 4px dashed var(--accent); }
        .qr-text { text-align: center; }
        .qr-text strong { display: block; font-size: 1.8rem; color: var(--accent); margin-bottom: 8px; font-weight: 900; }
        .qr-text span { font-size: 1.2rem; color: var(--muted); font-weight: bold; }
        #qrcode { background: white; padding: 15px; border-radius: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); }
        #qrcode img { display: block; margin: 0 auto; width: 180px !important; height: 180px !important; }

        .doctors-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 35px; }
        .doc-card { background: var(--card); border-radius: 30px; padding: 50px 30px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.06); border: 4px solid transparent; transition: 0.3s; }
        .doc-card.active-call { border-color: var(--warning); animation: pulse 1.5s infinite; }
        
        .doc-name { font-size: 2.3rem; font-weight: 800; margin-bottom: 25px; color: var(--text); }
        .number-box { background: rgba(16, 185, 129, 0.1); color: var(--accent); font-size: 8rem; font-weight: 900; padding: 30px; border-radius: 24px; margin-bottom: 25px; line-height: 1; }
        .waiting { font-size: 1.5rem; color: var(--muted); font-weight: bold; }

        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); } 70% { transform: scale(1.02); box-shadow: 0 0 0 25px rgba(245, 158, 11, 0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">ClinicFlow <span style="font-size: 1.5rem; color: var(--text);" id="clinicTitle"></span></div>
        <div class="qr-container" id="qrContainer" style="display: none;">
            <div class="qr-text">
                <strong data-i18n="qrScan">امسح الكود للحجز</strong>
                <span data-i18n="qrSub">احجز تذكرتك من هاتفك فوراً</span>
            </div>
            <div id="qrcode"></div>
        </div>
        <div class="controls">
            <div style="display: flex; gap: 10px;">
                <select id="langSelect" onchange="changeLang(this.value)">
                    <option value="ar">العربية</option>
                    <option value="fr">Français</option>
                    <option value="en">English</option>
                </select>
                <button class="theme-btn" onclick="toggleTheme()" data-i18n="btnTheme">🌓 الوضع الليلي</button>
            </div>
            <button class="sound-btn" id="enableAudioBtn" onclick="enableAudioAndFullscreen()" data-i18n="btnAudio">🔊 تفعيل الصوت وملء الشاشة</button>
        </div>
    </div>
    <div class="doctors-grid" id="doctorsList">
        <h2 style="text-align: center; width: 100%; color: var(--muted); font-size: 2rem;" data-i18n="loading">جاري تحميل البيانات...</h2>
    </div>

    <script>
        const CLINIC_SLUG = new URLSearchParams(window.location.search).get('clinic');
        const bellAudio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        if (CLINIC_SLUG) {
            document.getElementById('clinicTitle').innerText = `- ${CLINIC_SLUG}`;
            document.getElementById('qrContainer').style.display = 'flex';
            const bookingUrl = `https://clinic-server-i00s.onrender.com/patient.html?clinic=${CLINIC_SLUG}`;
            new QRCode(document.getElementById("qrcode"), {
                text: bookingUrl,
                width: 180, 
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
        }

        const dict = {
            ar: { btnTheme: "🌓 الوضع الليلي", btnAudio: "🔊 تفعيل الصوت وملء الشاشة", audioReady: "✅ الصوت مفعل", loading: "جاري تحميل البيانات...", waiting: "عدد المنتظرين في الطابور:", empty: "لا يوجد أطباء متاحين.", qrScan: "امسح الكود للحجز", qrSub: "احجز تذكرتك من هاتفك فوراً" },
            fr: { btnTheme: "🌓 Mode Sombre", btnAudio: "🔊 Activer Son & Plein Écran", audioReady: "✅ Son Activé", loading: "Chargement...", waiting: "En attente:", empty: "Aucun médecin.", qrScan: "Scannez pour réserver", qrSub: "Réservez depuis votre téléphone" },
            en: { btnTheme: "🌓 Dark Mode", btnAudio: "🔊 Enable Sound & Fullscreen", audioReady: "✅ Sound Enabled", loading: "Loading...", waiting: "Waiting:", empty: "No doctors available.", qrScan: "Scan to Book", qrSub: "Book from your phone" }
        };

        let currentLang = localStorage.getItem('tv_lang') || 'ar';
        function changeLang(lang) {
            currentLang = lang; localStorage.setItem('tv_lang', lang);
            document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelect').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });
            fetchDoctors();
        }

        function enableAudioAndFullscreen() {
            bellAudio.play().then(() => {
                bellAudio.pause();
                bellAudio.currentTime = 0;
            }).catch(() => {});
            const btn = document.getElementById('enableAudioBtn');
            btn.innerText = dict[currentLang].audioReady;
            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') !== 'dark';
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('tv_theme', isDark ? 'dark' : 'light');
        };

        window.onload = () => {
            changeLang(currentLang);
            if (localStorage.getItem('tv_theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            fetchDoctors();
        };

        async function fetchDoctors() {
            if (!CLINIC_SLUG) return;
            try {
                const res = await fetch(`https://clinic-server-i00s.onrender.com/api/clinic-doctors/${CLINIC_SLUG}`);
                const data = await res.json();
                if (data.length === 0) return document.getElementById('doctorsList').innerHTML = `<h2 style="text-align: center; width: 100%;">${dict[currentLang].empty}</h2>`;
                
                let html = '';
                data.forEach(doc => {
                    html += `
                        <div class="doc-card" id="card-${doc.slug}">
                            <div class="doc-name">👨‍⚕️ ${doc.name}</div>
                            <div class="number-box" id="num-${doc.slug}">${doc.current === 0 ? '--' : doc.current}</div>
                            <div class="waiting">${dict[currentLang].waiting} <span id="wait-${doc.slug}" style="font-size: 1.8rem; color: var(--text);">${doc.waiting}</span></div>
                        </div>
                    `;
                });
                document.getElementById('doctorsList').innerHTML = html;
            } catch (e) {}
        }
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io('https://clinic-server-i00s.onrender.com');
        socket.on('call_patient', (data) => {
            const card = document.getElementById(`card-${data.clinic_slug}`);
            const numEl = document.getElementById(`num-${data.clinic_slug}`);
            if (card && numEl) {
                numEl.innerText = data.current_number;
                // لا يرن الجرس ولا تومض الشاشة إذا كانت التذكرة ملغاة
                if (data.status !== 'cancelled') {
                    bellAudio.currentTime = 0;
                    bellAudio.play().catch(e => console.log('Autoplay blocked'));
                    card.classList.add('active-call');
                    setTimeout(() => card.classList.remove('active-call'), 5000);
                }
                fetchDoctors(); 
            }
        });
        socket.on('new_ticket', () => { fetchDoctors(); });
        socket.on('ticket_cancelled', () => { fetchDoctors(); });
    </script>
</body>
</html>
