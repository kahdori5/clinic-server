<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ClinicFlow - TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f4f7f6; margin: 0; height: 100vh; display: flex; color: #2d3748;}
        .left-panel { flex: 1; display: flex; justify-content: center; align-items: center; }
        .number-box { background: white; padding: 50px 100px; border-radius: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e2e8f0;}
        .number { font-size: 15rem; font-weight: 900; color: #40757d; margin: 0; line-height: 1; }
        .right-panel { width: 350px; background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; }
        .qr-wrapper img { width: 250px; height: 250px; border-radius: 15px; margin-bottom: 20px; }
        .overlay-paused { display: none; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); color: white; justify-content: center; align-items: center; font-size: 4rem; z-index: 1000;}
        .btn-sound { position: absolute; top: 20px; left: 20px; padding: 10px 20px; border-radius: 10px; background: #10b981; color: white; border: none; cursor: pointer; font-family: inherit; font-weight: bold;}
    </style>
</head>
<body>
    <button class="btn-sound" onclick="enableSound(this)">🔊 تفعيل النداء الصوتي</button>

    <div class="left-panel">
        <div class="number-box">
            <h1 style="margin:0; opacity:0.8;">الرقم الحالي</h1>
            <div class="number" id="currentTicket">--</div>
        </div>
    </div>
    <div class="right-panel">
        <h2>اسحب تذكرتك الآن</h2>
        <div class="qr-wrapper"><img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://clinic-server-i00s.onrender.com/patient.html"></div>
        <p>قم بتوجيه كاميرا هاتفك نحو الكود</p>
    </div>

    <div class="overlay-paused" id="pausedMsg">الاستقبال مغلق مؤقتاً، يرجى الانتظار</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let soundEnabled = false;
        function enableSound(btn) {
            soundEnabled = true;
            btn.style.background = '#ccc';
            btn.innerText = '✔️ الصوت مفعل';
            // خدعة لتهيئة محرك الصوت في المتصفح
            let initVoice = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(initVoice);
        }

        const socket = io('https://clinic-server-i00s.onrender.com');
        
        socket.on('call_patient', (data) => {
            document.getElementById('currentTicket').innerText = data.current_number;
            
            if(soundEnabled) {
                let msg = new SpeechSynthesisUtterance(`رقم ${data.current_number}، تفضل بالدخول`);
                msg.lang = 'ar-SA'; // نطق عربي
                window.speechSynthesis.speak(msg);
            }
        });

        socket.on('queue_status_changed', (data) => {
            document.getElementById('pausedMsg').style.display = data.status === 'paused' ? 'flex' : 'none';
        });
    </script>
</body>
</html>
