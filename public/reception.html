<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ClinicFlow - مكتب الاستقبال</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f4f7f6; margin: 0; padding: 40px; display: flex; gap: 30px; justify-content: center;}
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 350px; text-align: center;}
        input, button { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; font-family: inherit; font-size: 1.1rem; box-sizing: border-box; margin-bottom: 15px;}
        .btn-add { background: #40757d; color: white; border: none; cursor: pointer; font-weight: bold;}
        .btn-pause { background: #f59e0b; color: white; border: none; cursor: pointer; font-weight: bold;}
        .btn-resume { background: #10b981; color: white; border: none; cursor: pointer; font-weight: bold; display: none;}
    </style>
</head>
<body>
    <div class="card">
        <h2>إضافة مريض (يدوياً)</h2>
        <p style="color: #666;">للمرضى الذين لا يملكون هواتف ذكية.</p>
        <input type="text" id="patName" placeholder="اسم المريض...">
        <button class="btn-add" onclick="addManualTicket()">سحب تذكرة وطباعتها</button>
    </div>

    <div class="card">
        <h2>التحكم بالطابور</h2>
        <p style="color: #666;">في حال خروج الطبيب لاستراحة.</p>
        <button class="btn-pause" id="btnPause" onclick="toggleQueue('paused')">⏸️ إيقاف الطابور مؤقتاً</button>
        <button class="btn-resume" id="btnResume" onclick="toggleQueue('active')">▶️ استئناف الطابور</button>
    </div>

    <script>
        async function addManualTicket() {
            const name = document.getElementById('patName').value;
            if(!name) return alert('أدخل الاسم');
            const res = await fetch('https://clinic-server-i00s.onrender.com/api/tickets', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clinic_slug: 'default-clinic', patient_name: name })
            });
            const data = await res.json();
            if(res.ok) { alert(data.message); document.getElementById('patName').value = ''; }
            else alert(data.message);
        }

        async function toggleQueue(status) {
            await fetch('https://clinic-server-i00s.onrender.com/api/queues/toggle', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clinic_slug: 'default-clinic', status })
            });
            if(status === 'paused') {
                document.getElementById('btnPause').style.display = 'none';
                document.getElementById('btnResume').style.display = 'block';
            } else {
                document.getElementById('btnPause').style.display = 'block';
                document.getElementById('btnResume').style.display = 'none';
            }
        }
    </script>
</body>
</html>
