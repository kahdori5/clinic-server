<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ClinicFlow - Reception</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --accent: #40757d; --border: #e2e8f0; --muted: #718096; --success: #10b981; --warning: #f59e0b; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --border: #334155; --muted: #94a3b8; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; min-height: 100vh; transition: 0.3s; }
        header { display: flex; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid var(--border); background: var(--card); align-items: center;}
        .controls { display: flex; gap: 10px; }
        select, .theme-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 12px; cursor: pointer; font-family: inherit; outline: none; }
        .dashboard { flex: 1; padding: 40px; max-width: 1000px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .docs-stats { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 30px; }
        .doc-badge { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); min-width: 180px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .doc-badge strong { font-size: 2rem; color: var(--accent); display: block; margin-top: 10px; line-height: 1; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .card { background: var(--card); padding: 35px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .card h2 { margin-top: 0; font-size: 1.4rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;}
        input, .large-select { width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); font-family: inherit; font-size: 1rem; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; color: white; font-family: inherit; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-add { background: var(--accent); box-shadow: 0 10px 20px rgba(64, 117, 125, 0.2); }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 40px; border-radius: 24px; text-align: center; width: 90%; max-width: 420px; animation: slideUp 0.3s ease-out; border: 1px solid var(--border); }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .ticket-result { background: rgba(64, 117, 125, 0.08); padding: 25px 20px; border-radius: 15px; margin: 20px 0; border: 1.5px dashed var(--accent); font-size: 1.15rem; color: var(--muted); }
        .ticket-result strong { font-size: 4.5rem; color: var(--accent); display: block; margin-top: 15px; line-height: 1; }
        .modal-btns { display: flex; gap: 15px; margin-top: 30px; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 800; font-size: 1.3rem; display: flex; align-items: center; gap: 10px;">
            🖥️ <span data-i18n="title">مكتب الاستقبال</span> <span id="clinicNameDisplay" style="color:var(--muted); font-size:0.9rem;"></span>
        </div>
        <div class="controls">
            <select id="langSelect" onchange="changeLang(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
            <button class="theme-btn" onclick="toggleTheme()">🌓 <span data-i18n="darkMode">الوضع الليلي</span></button>
        </div>
    </header>

    <div class="dashboard">
        <h3 style="color: var(--text);" data-i18n="docStatus">حالة الأطباء والمرضى المنتظرين:</h3>
        <div class="docs-stats" id="docsStats">جاري التحميل...</div>

        <div class="grid-container">
            <div class="card">
                <h2 data-i18n="addTitle">🖨️ سحب تذكرة جديدة</h2>
                
                <label style="display: block; margin-bottom: 8px; color: var(--muted);" data-i18n="selectDoc">اختر الطبيب:</label>
                <select id="docSelect" class="large-select"></select>
                
                <input type="text" id="patName" data-i18n-ph="namePh" placeholder="اسم المريض...">
                <button class="btn btn-add" id="drawBtn" onclick="addManualTicket()" data-i18n="drawBtn">سحب التذكرة الان</button>
            </div>

            <div class="card">
                <h2 data-i18n="ctrlTitle">⚙️ التحكم في الطابور</h2>
                <label style="display: block; margin-bottom: 8px; color: var(--muted);">اختر الطبيب للإيقاف أو التشغيل:</label>
                <select id="ctrlDocSelect" class="large-select"></select>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" style="background: var(--warning); flex: 1;" onclick="toggleQueue('paused')" data-i18n="pauseBtn">⏸️ إيقاف</button>
                    <button class="btn" style="background: var(--success); flex: 1;" onclick="toggleQueue('active')" data-i18n="resumeBtn">▶️ استئناف</button>
                </div>
                <p style="font-size: 0.9rem; color: var(--muted); margin-top: 15px;" id="docStatusMsg">حالة الطبيب المختار ستظهر هنا</p>
            </div>
        </div>
    </div>

    <!-- نافذة الطباعة المنبثقة -->
    <div class="modal-overlay" id="ticketModal">
        <div class="modal-content">
            <div style="font-size: 4rem; margin-bottom: 10px;">✅</div>
            <h2 style="margin-top: 0; color: var(--text);" data-i18n="successMsg">تم تسجيل المريض بنجاح!</h2>
            <div class="ticket-result">
                <span data-i18n="patientNumWord">رقم المريض</span> 
                (<span id="modalPatientName" style="font-weight: 800; color: var(--text);"></span>) 
                <span data-i18n="isWord">هو</span>
                <strong id="modalTicketNumber">--</strong>
                <div style="font-size: 0.9rem; margin-top: 10px;" id="modalDocName"></div>
            </div>
            <div class="modal-btns">
                <button class="btn" style="background: var(--muted); flex: 1;" onclick="document.getElementById('ticketModal').style.display='none'" data-i18n="closeBtn">إغلاق</button>
                <button class="btn" style="background: var(--text); flex: 2;" onclick="printTicket()" data-i18n="printBtn">🖨️ طباعة التذكرة</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const MAIN_SLUG = new URLSearchParams(window.location.search).get('clinic');
        if(MAIN_SLUG) document.getElementById('clinicNameDisplay').innerText = `(${MAIN_SLUG})`;

        const dict = {
            ar: { title: "مكتب الاستقبال", darkMode: "الوضع الليلي", docStatus: "حالة الأطباء والمرضى المنتظرين:", addTitle: "🖨️ سحب تذكرة جديدة", selectDoc: "اختر الطبيب:", namePh: "اسم المريض...", drawBtn: "سحب التذكرة الان", drawLoading: "جاري السحب...", ctrlTitle: "⚙️ التحكم في الطابور", pauseBtn: "⏸️ إيقاف", resumeBtn: "▶️ استئناف", successMsg: "تم تسجيل المريض بنجاح!", noNameMsg: "الرجاء إدخال اسم المريض واختيار الطبيب", patientNumWord: "رقم المريض", isWord: "هو", closeBtn: "إغلاق", printBtn: "🖨️ طباعة التذكرة", waitingWord: "منتظر" },
            fr: { title: "Réception", darkMode: "Mode Sombre", docStatus: "Statut des médecins:", addTitle: "🖨️ Nouveau Ticket", selectDoc: "Choisir le médecin:", namePh: "Nom complet...", drawBtn: "Tirer un Ticket", drawLoading: "Chargement...", ctrlTitle: "⚙️ Contrôle", pauseBtn: "⏸️ Suspendre", resumeBtn: "▶️ Reprendre", successMsg: "Patient enregistré!", noNameMsg: "Veuillez entrer le nom", patientNumWord: "Le numéro", isWord: "est", closeBtn: "Fermer", printBtn: "🖨️ Imprimer", waitingWord: "En attente" },
            en: { title: "Reception Desk", darkMode: "Dark Mode", docStatus: "Doctors & Waiting Patients:", addTitle: "🖨️ New Ticket", selectDoc: "Select Doctor:", namePh: "Patient's name...", drawBtn: "Draw Ticket", drawLoading: "Drawing...", ctrlTitle: "⚙️ Queue Control", pauseBtn: "⏸️ Pause", resumeBtn: "▶️ Resume", successMsg: "Patient registered!", noNameMsg: "Please enter patient name", patientNumWord: "The number", isWord: "is", closeBtn: "Close", printBtn: "🖨️ Print Ticket", waitingWord: "Waiting" }
        };

        let currentLang = 'ar';
        function changeLang(lang) {
            currentLang = lang; localStorage.setItem('lang', lang);
            document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelect').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[lang][el.getAttribute('data-i18n')]);
            document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = dict[lang][el.getAttribute('data-i18n-ph')]);
            fetchDoctors(); // لإعادة كتابة كلمة "منتظر" باللغة الجديدة
        }

        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') !== 'dark';
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        let doctorsData = [];

        window.onload = async () => {
            changeLang(localStorage.getItem('lang') || 'ar');
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            await fetchDoctors();
        };

        async function fetchDoctors() {
            if(!MAIN_SLUG) return;
            try {
                const res = await fetch(`https://clinic-server-i00s.onrender.com/api/clinic-doctors/${MAIN_SLUG}`);
                doctorsData = await res.json();
                
                const stats = document.getElementById('docsStats');
                const docSelect = document.getElementById('docSelect');
                const ctrlSelect = document.getElementById('ctrlDocSelect');
                
                const currentDocVal = docSelect.value;
                const currentCtrlVal = ctrlSelect.value;

                stats.innerHTML = ''; docSelect.innerHTML = ''; ctrlSelect.innerHTML = '';

                if(doctorsData.length === 0) {
                    stats.innerHTML = '<p style="color: var(--warning);">لا يوجد أطباء في هذه العيادة. يرجى إضافتهم من لوحة الإدارة.</p>';
                }

                doctorsData.forEach(d => {
                    // تحديث المربعات العلوية
                    const statusIcon = d.status === 'paused' ? '🔴 متوقف' : '🟢 يعمل';
                    stats.innerHTML += `
                        <div class="doc-badge">
                            <span style="color: var(--text); font-weight: bold; font-size: 1.1rem;">${d.name}</span>
                            <span style="display:block; font-size:0.8rem; color:var(--muted); margin-top:5px;">${statusIcon}</span>
                            <strong>${d.waiting} <span style="font-size: 1rem;">${dict[currentLang].waitingWord}</span></strong>
                        </div>
                    `;
                    // تحديث القوائم المنسدلة
                    docSelect.innerHTML += `<option value="${d.slug}">${d.name}</option>`;
                    ctrlSelect.innerHTML += `<option value="${d.slug}">${d.name}</option>`;
                });

                if(currentDocVal) docSelect.value = currentDocVal;
                if(currentCtrlVal) ctrlSelect.value = currentCtrlVal;
            } catch(e) {}
        }

        async function addManualTicket() {
            const slug = document.getElementById('docSelect').value;
            const docName = document.getElementById('docSelect').options[document.getElementById('docSelect').selectedIndex].text;
            const name = document.getElementById('patName').value.trim();
            
            if(!name || !slug) return alert(dict[currentLang].noNameMsg);
            
            const btn = document.getElementById('drawBtn');
            btn.innerText = dict[currentLang].drawLoading; btn.disabled = true;

            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/tickets', { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ clinic_slug: slug, patient_name: name }) 
                });
                const data = await res.json();
                
                if(res.ok) { 
                    document.getElementById('modalPatientName').innerText = name;
                    document.getElementById('modalTicketNumber').innerText = data.message.match(/\d+/)[0];
                    document.getElementById('modalDocName').innerText = `طبيب: ${docName}`;
                    document.getElementById('ticketModal').style.display = 'flex';
                    document.getElementById('patName').value = ''; 
                    fetchDoctors();
                } else {
                    alert(data.error || data.message);
                }
            } catch(e) { alert('خطأ في الاتصال بالخادم'); }
            
            btn.innerText = dict[currentLang].drawBtn; btn.disabled = false;
        }

        function printTicket() {
            const pName = document.getElementById('modalPatientName').innerText;
            const pNum = document.getElementById('modalTicketNumber').innerText;
            const pDoc = document.getElementById('modalDocName').innerText;
            const printWindow = window.open('', '', 'width=400,height=500');
            printWindow.document.write(`
                <html dir="${currentLang === 'ar' ? 'rtl' : 'ltr'}">
                <body style="font-family: sans-serif; text-align: center; padding: 20px;">
                    <h2>ClinicFlow</h2><p style="color: #666; margin-bottom: 20px;">تذكرة انتظار / Waiting Ticket</p><hr style="border: 1px dashed #ccc;">
                    <h4 style="margin: 10px 0; color: #555;">${pDoc}</h4>
                    <h3 style="margin-top: 20px;">${pName}</h3><h1 style="font-size: 6rem; margin: 10px 0;">${pNum}</h1>
                    <hr style="border: 1px dashed #ccc; margin-bottom: 20px;"><p style="font-size: 0.9rem;">يرجى الانتظار حتى يتم المناداة على رقمك</p>
                    <script>window.onload = () => { window.print(); window.close(); }<\/script>
                </body></html>
            `);
            printWindow.document.close(); 
            document.getElementById('ticketModal').style.display = 'none';
        }

        async function toggleQueue(status) {
            const slug = document.getElementById('ctrlDocSelect').value;
            if(!slug) return;
            try { 
                await fetch('https://clinic-server-i00s.onrender.com/api/queues/toggle', { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ clinic_slug: slug, status }) 
                });
                document.getElementById('docStatusMsg').innerText = status === 'paused' ? 'تم إيقاف طابور الطبيب المختار' : 'الطابور يعمل الآن';
                fetchDoctors();
            } catch(e) { alert('خطأ في الاتصال'); }
        }

        const socket = io('https://clinic-server-i00s.onrender.com');
        socket.on('new_ticket', fetchDoctors); 
        socket.on('call_patient', fetchDoctors);
        socket.on('queue_status_changed', fetchDoctors);
    </script>
</body>
</html>
