<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ClinicFlow - Reception</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>:root{--bg:#f4f7f6;--card:#ffffff;--text:#2d3748;--accent:#40757d;--border:#e2e8f0;--muted:#718096;}[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--accent:#38bdf8;--border:#334155;}body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);margin:0;display:flex;flex-direction:column;min-height:100vh;} header{padding:20px 40px; background:var(--card); border-bottom:1px solid var(--border); display:flex; justify-content:space-between;} .dashboard{flex:1; padding:40px; max-width:800px; margin:0 auto; width:100%;} .card{background:var(--card); padding:35px; border-radius:20px; border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,0.05);} select, input, button {width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:1.1rem;} .btn{background:var(--accent); color:white; font-weight:bold; border:none; cursor:pointer;} .docs-stats{margin-bottom:30px; display:flex; gap:10px; overflow-x:auto;} .doc-badge{background:var(--card); padding:15px; border-radius:15px; border:1px solid var(--border); min-width:150px; text-align:center;} .doc-badge strong{color:var(--accent); font-size:1.5rem; display:block;}</style>
</head>
<body>
    <header>
        <div style="font-weight: 800; font-size: 1.3rem;">🖥️ مكتب الاستقبال</div>
        <button class="btn" style="width:auto; padding:10px;" onclick="document.body.setAttribute('data-theme', document.body.getAttribute('data-theme')==='dark'?'light':'dark')">🌓</button>
    </header>
    <div class="dashboard">
        <h3 style="color:var(--muted);">حالة الأطباء:</h3>
        <div class="docs-stats" id="docsStats">جاري التحميل...</div>

        <div class="card">
            <h2>🖨️ سحب تذكرة يدوية</h2>
            <label>اختر الطبيب:</label>
            <select id="docSelect"></select>
            <input type="text" id="patName" placeholder="اسم المريض...">
            <button class="btn" onclick="addTicket()">سحب وطباعة التذكرة</button>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const MAIN_SLUG = new URLSearchParams(window.location.search).get('clinic');
        
        async function fetchDoctors() {
            const res = await fetch(`https://clinic-server-i00s.onrender.com/api/clinic-doctors/${MAIN_SLUG}`);
            const docs = await res.json();
            const stats = document.getElementById('docsStats'); const select = document.getElementById('docSelect');
            stats.innerHTML = ''; select.innerHTML = '';
            docs.forEach(d => {
                stats.innerHTML += `<div class="doc-badge">${d.name}<strong>${d.waiting} منتظر</strong></div>`;
                select.innerHTML += `<option value="${d.slug}">${d.name}</option>`;
            });
        }

        async function addTicket() {
            const slug = document.getElementById('docSelect').value;
            const name = document.getElementById('patName').value;
            if(!name || !slug) return alert('يرجى تعبئة البيانات');
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/tickets', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({clinic_slug: slug, patient_name: name}) });
                const data = await res.json();
                if(res.ok) {
                    alert(`تم الحجز بنجاح!\n${data.message}`);
                    document.getElementById('patName').value = '';
                    fetchDoctors(); // تحديث الأرقام
                } else alert(data.error);
            } catch(e) { alert('خطأ اتصال'); }
        }

        window.onload = fetchDoctors;
        const socket = io('https://clinic-server-i00s.onrender.com');
        socket.on('new_ticket', fetchDoctors); socket.on('call_patient', fetchDoctors);
    </script>
</body>
</html>
