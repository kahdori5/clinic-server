<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ClinicFlow - Reception</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>:root{--bg:#f4f7f6;--card:#ffffff;--text:#2d3748;--accent:#40757d;--border:#e2e8f0;--muted:#718096;--success:#10b981;--warning:#f59e0b;}body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);margin:0;min-height:100vh;display:flex;flex-direction:column;}header{display:flex;justify-content:space-between;padding:20px 40px;border-bottom:1px solid var(--border);background:var(--card);}.dashboard{flex:1;padding:40px;max-width:1000px;margin:0 auto;width:100%;box-sizing:border-box;}.live-stats-bar{display:flex;gap:20px;margin-bottom:40px;}.stat-box{flex:1;background:var(--card);padding:25px;border-radius:20px;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}.stat-box span{font-size:1rem;color:var(--muted);}.stat-box strong{font-size:2.5rem;color:var(--text);}.grid-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;}.card{background:var(--card);padding:35px;border-radius:24px;border:1px solid var(--border);}input{width:100%;padding:16px;border:1px solid var(--border);border-radius:12px;margin-bottom:20px;font-family:inherit;font-size:1rem;box-sizing:border-box;}.btn{width:100%;padding:18px;border:none;border-radius:12px;font-size:1.1rem;font-weight:bold;cursor:pointer;color:white;font-family:inherit;}.btn-add{background:var(--accent);}.btn-pause{background:var(--warning);}.btn-resume{background:var(--success);display:none;}.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:2000;justify-content:center;align-items:center;}.modal-content{background:var(--card);padding:40px;border-radius:24px;text-align:center;width:90%;max-width:420px;}.ticket-result{background:rgba(64,117,125,0.08);padding:25px 20px;border-radius:15px;margin:20px 0;border:1.5px dashed var(--accent);font-size:1.15rem;color:var(--muted);}.ticket-result strong{font-size:4.5rem;color:var(--accent);display:block;margin-top:15px;}</style>
</head>
<body>
    <header><div style="font-weight: 800; font-size: 1.3rem;">🖥️ مكتب الاستقبال <span id="clinicNameDisplay" style="color:var(--muted);font-size:1rem;"></span></div></header>
    <div class="dashboard">
        <div class="live-stats-bar">
            <div class="stat-box"><div><span>رقم المريض بالداخل</span><strong id="liveCurrent">--</strong></div></div>
            <div class="stat-box"><div><span>المرضى في الانتظار</span><strong id="liveWaiting" style="color:var(--accent);">--</strong></div></div>
        </div>
        <div class="grid-container">
            <div class="card"><h2>🖨️ إضافة مريض يدوياً</h2><input type="text" id="patName" placeholder="اسم المريض..."><button class="btn btn-add" onclick="addManualTicket()">سحب التذكرة</button></div>
            <div class="card"><h2>⚙️ التحكم في الطابور</h2><button class="btn btn-pause" id="btnPause" onclick="toggleQueue('paused')">⏸️ إيقاف الطابور</button><button class="btn btn-resume" id="btnResume" onclick="toggleQueue('active')">▶️ استئناف الطابور</button></div>
        </div>
    </div>
    <div class="modal-overlay" id="ticketModal">
        <div class="modal-content">
            <h2>تم التسجيل!</h2>
            <div class="ticket-result">رقم المريض (<span id="modalPatientName" style="color:var(--text);"></span>) هو<strong id="modalTicketNumber">--</strong></div>
            <button class="btn" style="background:var(--muted); margin-bottom:10px;" onclick="document.getElementById('ticketModal').style.display='none'">إغلاق</button>
            <button class="btn" style="background:var(--text);" onclick="printTicket()">🖨️ طباعة</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const CLINIC_SLUG = new URLSearchParams(window.location.search).get('clinic') || 'default-clinic';
        document.getElementById('clinicNameDisplay').innerText = `(${CLINIC_SLUG})`;
        let lastIssued = 0; let currentNum = 0;
        
        window.onload = async () => {
            const res = await fetch(`https://clinic-server-i00s.onrender.com/api/queue-status/${CLINIC_SLUG}`);
            const data = await res.json();
            currentNum = data.current_number || 0; lastIssued = data.last_issued_number || 0;
            document.getElementById('liveCurrent').innerText = currentNum;
            document.getElementById('liveWaiting').innerText = (lastIssued - currentNum) > 0 ? (lastIssued - currentNum) : 0;
            if(data.status === 'paused') { document.getElementById('btnPause').style.display='none'; document.getElementById('btnResume').style.display='block'; }
        };

        async function addManualTicket() {
            const name = document.getElementById('patName').value;
            if(!name) return alert('الرجاء إدخال الاسم');
            const res = await fetch('https://clinic-server-i00s.onrender.com/api/tickets', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clinic_slug: CLINIC_SLUG, patient_name: name })
            });
            const data = await res.json();
            if(res.ok) {
                document.getElementById('modalPatientName').innerText = name;
                document.getElementById('modalTicketNumber').innerText = data.message.match(/\d+/)[0];
                document.getElementById('ticketModal').style.display = 'flex';
                document.getElementById('patName').value = '';
            } else alert(data.message);
        }

        function printTicket() { window.print(); document.getElementById('ticketModal').style.display='none'; }
        
        async function toggleQueue(status) {
            await fetch('https://clinic-server-i00s.onrender.com/api/queues/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ clinic_slug: CLINIC_SLUG, status }) });
            location.reload();
        }

        const socket = io('https://clinic-server-i00s.onrender.com');
        socket.on('call_patient', (data) => { if(data.clinic_slug === CLINIC_SLUG) { currentNum = data.current_number; document.getElementById('liveCurrent').innerText = currentNum; document.getElementById('liveWaiting').innerText = (lastIssued - currentNum) > 0 ? (lastIssued - currentNum) : 0; } });
        socket.on('new_ticket', (data) => { if(data.clinic_slug === CLINIC_SLUG) { lastIssued = data.ticket_number; document.getElementById('liveWaiting').innerText = (lastIssued - currentNum) > 0 ? (lastIssued - currentNum) : 0; } });
    </script>
</body>
</html>
