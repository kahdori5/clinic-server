<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستقبال - ClinicFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --accent: #10b981; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #10b981; --border: #334155; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 800px; margin-bottom: 30px; background: var(--card); padding: 15px 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
        .controls { display: flex; gap: 10px; }
        select, .theme-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 12px; cursor: pointer; font-weight: bold; outline: none; }
        
        .main-card { background: var(--card); padding: 40px; border-radius: 24px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; border: 1px solid var(--border); }
        h1 { margin-top: 0; color: var(--accent); }
        
        select.doc-select, input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 1.1rem; box-sizing: border-box; outline: none; }
        select.doc-select:focus, input:focus { border-color: var(--accent); }
        
        .btn { background: var(--accent); color: white; padding: 18px; border: none; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        
        .ticket-result { margin-top: 25px; padding: 20px; background: rgba(16, 185, 129, 0.1); border-radius: 16px; border: 2px dashed var(--accent); display: none; }
        .ticket-result h2 { margin: 0; color: var(--accent); font-size: 3rem; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="font-size: 1.5rem; font-weight: 800; color: var(--accent);">ClinicFlow <span style="font-size: 1rem; color: var(--text);" id="clinicTitle"></span></div>
        <div class="controls">
            <select id="langSelect" onchange="changeLang(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
            <button class="theme-btn" onclick="toggleTheme()" data-i18n="btnTheme">🌓 الوضع الليلي</button>
        </div>
    </div>

    <div class="main-card">
        <h1 data-i18n="title">مكتب الاستقبال والتسجيل</h1>
        
        <label style="display: block; text-align: start; margin-bottom: 10px; font-weight: bold;" data-i18n="selectDoc">اختر الطبيب المعالج:</label>
        <select id="doctorSelect" class="doc-select">
            <option value="" data-i18n="loadingDocs">جاري تحميل الأطباء...</option>
        </select>

        <label style="display: block; text-align: start; margin-bottom: 10px; font-weight: bold;" data-i18n="enterName">اسم المريض:</label>
        <input type="text" id="patientName" placeholder="أدخل اسم المريض هنا...">

        <button class="btn" onclick="bookTicket()" data-i18n="btnBook">سحب تذكرة جديدة</button>

        <div class="ticket-result" id="ticketResult">
            <span style="font-size: 1.2rem; font-weight: bold;" data-i18n="ticketMsg">رقم تذكرتك هو:</span>
            <h2 id="ticketNumberDisplay">0</h2>
            <button class="btn" style="margin-top: 15px; background: var(--text); color: var(--bg); padding: 10px;" onclick="window.print()" data-i18n="btnPrint">🖨️ طباعة التذكرة</button>
        </div>
    </div>

    <script>
        const CLINIC_SLUG = new URLSearchParams(window.location.search).get('clinic');
        if(CLINIC_SLUG) document.getElementById('clinicTitle').innerText = `- ${CLINIC_SLUG}`;

        const dict = {
            ar: { btnTheme: "🌓 الوضع الليلي", title: "مكتب الاستقبال والتسجيل", selectDoc: "اختر الطبيب المعالج:", loadingDocs: "اختر الطبيب...", enterName: "اسم المريض (اختياري):", btnBook: "سحب تذكرة", ticketMsg: "رقم التذكرة:", btnPrint: "🖨️ طباعة التذكرة", errSelect: "يرجى اختيار طبيب", errNet: "خطأ في الاتصال" },
            fr: { btnTheme: "🌓 Mode Sombre", title: "Réception", selectDoc: "Choisir le médecin:", loadingDocs: "Choisir...", enterName: "Nom du patient :", btnBook: "Prendre un ticket", ticketMsg: "Numéro de ticket:", btnPrint: "🖨️ Imprimer", errSelect: "Veuillez choisir un médecin", errNet: "Erreur de connexion" },
            en: { btnTheme: "🌓 Dark Mode", title: "Reception Desk", selectDoc: "Select Doctor:", loadingDocs: "Select...", enterName: "Patient Name:", btnBook: "Get Ticket", ticketMsg: "Ticket Number:", btnPrint: "🖨️ Print Ticket", errSelect: "Please select a doctor", errNet: "Connection error" }
        };

        let currentLang = localStorage.getItem('rec_lang') || 'ar';
        function changeLang(lang) {
            currentLang = lang; localStorage.setItem('rec_lang', lang);
            document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelect').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[lang][el.getAttribute('data-i18n')]);
            document.getElementById('patientName').placeholder = dict[lang].enterName;
        }

        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') !== 'dark';
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('rec_theme', isDark ? 'dark' : 'light');
        };

        window.onload = async () => {
            changeLang(currentLang);
            if(localStorage.getItem('rec_theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            
            if(CLINIC_SLUG) {
                try {
                    const res = await fetch(`https://clinic-server-i00s.onrender.com/api/clinic-doctors/${CLINIC_SLUG}`);
                    const doctors = await res.json();
                    const select = document.getElementById('doctorSelect');
                    select.innerHTML = `<option value="">-- ${dict[currentLang].loadingDocs} --</option>`;
                    doctors.forEach(doc => {
                        select.innerHTML += `<option value="${doc.slug}">${doc.name}</option>`;
                    });
                } catch(e) { }
            }
        };

        async function bookTicket() {
            const docSlug = document.getElementById('doctorSelect').value;
            const pName = document.getElementById('patientName').value.trim() || 'مريض';
            
            if(!docSlug) return alert(dict[currentLang].errSelect);

            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/tickets', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: docSlug, patient_name: pName })
                });
                const data = await res.json();
                if(res.ok) {
                    const num = data.message.match(/\d+/)[0];
                    document.getElementById('ticketNumberDisplay').innerText = num;
                    document.getElementById('ticketResult').style.display = 'block';
                    document.getElementById('patientName').value = '';
                } else { alert(data.error); }
            } catch(e) { alert(dict[currentLang].errNet); }
        }
    </script>
</body>
</html>
