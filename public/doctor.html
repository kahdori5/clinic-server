<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow - Doctor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --accent: #10b981; --border: #e2e8f0; --muted: #718096; --danger: #ef4444; --warning: #f59e0b; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #10b981; --border: #334155; --muted: #94a3b8; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; transition: 0.3s; overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--card); border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px 0; z-index: 10; justify-content: space-between; }
        .logo { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 20px; color: var(--text); }
        .nav-item { padding: 16px 25px; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; border-inline-end: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: rgba(16, 185, 129, 0.1); color: var(--accent); border-color: var(--accent); }
        .support-box { padding: 20px; margin: 15px; background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 16px; text-align: center; }
        .support-box span { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 8px; }
        .support-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: white; padding: 10px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 0.9rem; width: 100%; box-sizing: border-box; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid var(--border); background: var(--card); }
        .controls { display: flex; gap: 10px; }
        select, .theme-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 12px; cursor: pointer; outline: none; font-weight: bold; }
        
        .content-scroll { padding: 40px; overflow-y: auto; flex: 1; }
        
        /* شاشة النداء والملف الطبي */
        .call-wrapper { display: flex; gap: 25px; flex-wrap: wrap; align-items: flex-start; justify-content: center; }
        .control-card { background: var(--card); padding: 40px; border-radius: 24px; text-align: center; border: 1px solid var(--border); flex: 1; min-width: 320px; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .number-display { font-size: 7rem; font-weight: 800; margin: 15px 0; line-height: 1; color: var(--text); }
        
        /* بطاقة الملف الطبي الاختياري */
        .medical-card { background: var(--card); padding: 35px; border-radius: 24px; border: 1px solid var(--border); flex: 2; min-width: 350px; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: none; animation: fadeIn 0.4s ease; }
        .medical-card h3 { margin-top: 0; color: var(--accent); font-size: 1.4rem; border-bottom: 2px dashed var(--border); padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .input-group label { display: block; color: var(--muted); font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        .input-group input, .input-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; font-family: inherit; box-sizing: border-box; }
        .input-group textarea { resize: vertical; min-height: 80px; }
        .prescription-area { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
        
        .btn { padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; color: white; width: 100%; margin-bottom: 15px; font-family: inherit; transition: 0.2s; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-call { background: var(--accent); font-size: 1.3rem; }
        .status-btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-done { background: #3b82f6; flex: 1; }
        .btn-absent { background: var(--danger); flex: 1; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; width: 100%; max-width: 900px; margin: 0 auto; }
        .stat-card { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid var(--border); text-align: center; }
        .stat-card span { color: var(--muted); font-size: 1.1rem; display: block; margin-bottom: 15px; }
        .stat-card strong { font-size: 4rem; color: var(--text); line-height: 1; display: block; }
        
        .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
        .toast { background: var(--card); color: var(--text); padding: 16px 25px; border-radius: 12px; border-inline-start: 5px solid var(--accent); font-weight: bold; display: flex; align-items: center; gap: 12px; animation: slideUp 0.4s ease; }
        .toast.warning { border-color: var(--warning); }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    
    <div class="sidebar">
        <div>
            <div class="logo">Clinic<span>Flow</span><br><span style="font-size: 0.85rem; color: var(--muted); font-weight: 500;" id="clinicNameDisplay">--</span></div>
            <div style="margin-top: 20px; display: flex; flex-direction: column; width: 100%;">
                <div class="nav-item active" onclick="switchTab('call-tab', this)">📢 شاشة النداء</div>
                <div class="nav-item" onclick="switchTab('stats-tab', this)">📊 إحصائيات العيادة</div>
            </div>
        </div>
        
        <div class="support-box">
            <span>تواجه مشكلة تقنية؟</span>
            <!-- تم تجهيز الرابط للاتصال الفوري -->
            <a href="tel:+213555000000" class="support-btn" id="supportPhoneLink">📞 اتصال بالمتحكم</a>
        </div>
    </div>

    <div class="main-content">
        <header>
            <div style="font-weight: 800; font-size: 1.3rem; display: flex; align-items: center; gap: 10px;">
                👨‍⚕️ لوحة الطبيب
            </div>
            <div class="controls">
                <button class="theme-btn" onclick="toggleTheme()">🌓 الوضع الليلي</button>
            </div>
        </header>

        <div class="content-scroll">
            
            <div id="call-tab" class="tab-content active">
                <div class="call-wrapper">
                    <!-- لوحة التحكم بالنداء -->
                    <div class="control-card">
                        <h2 style="margin:0; color: var(--muted); font-size: 1.2rem;">رقم المريض بالداخل</h2>
                        <div class="number-display" id="currentNumber">--</div>
                        <p id="currentPatientName" style="font-size: 1.2rem; font-weight: bold; color: var(--accent); margin-bottom: 25px;">--</p>
                        
                        <div class="status-btns">
                            <button class="btn btn-done" onclick="setStatus('completed')">✔️ تم الكشف</button>
                            <button class="btn btn-absent" onclick="setStatus('absent')">❌ غائب</button>
                        </div>
                        <button class="btn btn-call" onclick="callNextPatient()">📢 مناداة المريض التالي</button>
                    </div>

                    <!-- الملف الطبي والوصفة (تظهر فقط عند وجود مريض) -->
                    <div class="medical-card" id="medicalCard">
                        <h3>📋 الملف الطبي <span style="font-size:0.8rem; background:var(--bg); padding:4px 10px; border-radius:10px; color:var(--muted);">اختياري</span></h3>
                        
                        <div class="form-grid">
                            <div class="input-group">
                                <label>العمر:</label>
                                <input type="text" id="mAge" placeholder="مثال: 34 سنة">
                            </div>
                            <div class="input-group">
                                <label>فصيلة الدم:</label>
                                <input type="text" id="mBlood" placeholder="مثال: O+">
                            </div>
                        </div>
                        <div class="form-grid">
                            <div class="input-group">
                                <label>حساسية للأدوية:</label>
                                <input type="text" id="mAllergy" placeholder="لا يوجد">
                            </div>
                            <div class="input-group">
                                <label>أمراض مزمنة:</label>
                                <input type="text" id="mChronic" placeholder="سكري، ضغط...">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>التشخيص والملاحظات (زيارة اليوم):</label>
                            <textarea id="mNotes" placeholder="أعراض المريض وتشخيص الطبيب..."></textarea>
                        </div>
                        
                        <button class="btn btn-outline" style="margin-top:10px;" onclick="saveMedicalRecord()">💾 حفظ الملف الطبي للمريض</button>

                        <div class="prescription-area">
                            <h4 style="margin-top:0; color:var(--text);">💊 الوصفة الطبية (Ordonnance)</h4>
                            <div class="input-group">
                                <textarea id="mPrescription" placeholder="اكتب الأدوية هنا، كل دواء في سطر..."></textarea>
                            </div>
                            <button class="btn" style="background:var(--text); color:var(--bg);" onclick="printPrescription()">🖨️ طباعة الوصفة الطبية</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- صفحة الإحصائيات -->
            <div id="stats-tab" class="tab-content">
                <h2 style="margin-top: 0; margin-bottom: 30px; color: var(--text); text-align: center;">نظرة عامة على أداء العيادة</h2>
                <div class="stats-grid">
                    <div class="stat-card" style="border: 2px solid var(--accent); background: rgba(16, 185, 129, 0.05);">
                        <span style="color: var(--accent); font-weight: bold;">المرضى في الانتظار حالياً</span>
                        <strong id="statWaiting" style="color: var(--accent);">0</strong>
                    </div>
                    <div class="stat-card">
                        <span>إجمالي مرضى اليوم</span>
                        <strong id="statToday">0</strong>
                    </div>
                    <div class="stat-card">
                        <span>مرضى هذا الأسبوع</span>
                        <strong id="statWeekly">0</strong>
                    </div>
                    <div class="stat-card">
                        <span>مرضى هذا الشهر</span>
                        <strong id="statMonthly">0</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const CLINIC_SLUG = new URLSearchParams(window.location.search).get('clinic') || 'default-clinic';
        if(CLINIC_SLUG !== 'default-clinic') document.getElementById('clinicNameDisplay').innerText = `(${CLINIC_SLUG})`;

        // يمكنك تغيير الرقم هنا ليظهر للطبيب للاتصال بك
        const ADMIN_PHONE = "+213555000000"; 
        document.getElementById('supportPhoneLink').href = `tel:${ADMIN_PHONE}`;

        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') !== 'dark';
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3500);
        }

        let currentNum = 0;
        let activePatientName = '';
        let activeDoctorName = 'الطبيب المختص';

        window.onload = async () => {
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            await fetchStatus(); await fetchStats();
        };

        async function fetchStatus() {
            try {
                const res = await fetch(`https://clinic-server-i00s.onrender.com/api/queue-status/${CLINIC_SLUG}`);
                const data = await res.json();
                currentNum = data.current_number || 0;
                document.getElementById('currentNumber').innerText = currentNum === 0 ? '--' : currentNum;
            } catch(e) {}
        }

        async function fetchStats() {
            try {
                const res = await fetch(`https://clinic-server-i00s.onrender.com/api/doctor-stats/${CLINIC_SLUG}`);
                const data = await res.json();
                document.getElementById('statWaiting').innerText = data.waiting;
                document.getElementById('statToday').innerText = data.today;
                document.getElementById('statWeekly').innerText = data.weekly;
                document.getElementById('statMonthly').innerText = data.monthly;
            } catch(e) {}
        }

        // مناداة المريض وجلب ملفه الطبي
        async function callNextPatient() {
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/call-next', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: CLINIC_SLUG })
                });
                const data = await res.json();
                if (res.ok) {
                    currentNum = parseInt(data.message.match(/\d+/)[0]);
                    activePatientName = data.patient_name;
                    activeDoctorName = data.doctor_name;
                    
                    document.getElementById('currentNumber').innerText = currentNum;
                    document.getElementById('currentPatientName').innerText = `👤 المريض: ${activePatientName}`;
                    document.getElementById('medicalCard').style.display = 'block'; 
                    
                    showToast(`📢 تم مناداة الرقم: ${currentNum}`, 'success');
                    fetchStats(); 
                    
                    await loadMedicalRecord();
                } else { showToast('⚠️ لا يوجد أي مريض في الانتظار حالياً.', 'warning'); }
            } catch(e) { showToast('خطأ في الاتصال', 'error'); }
        }

        async function loadMedicalRecord() {
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/patient/get', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: CLINIC_SLUG, patient_name: activePatientName })
                });
                const data = await res.json();
                document.getElementById('mAge').value = data.age || '';
                document.getElementById('mBlood').value = data.blood_type || '';
                document.getElementById('mAllergy').value = data.allergies || '';
                document.getElementById('mChronic').value = data.chronic_diseases || '';
                document.getElementById('mNotes').value = data.notes || '';
                document.getElementById('mPrescription').value = ''; 
            } catch (e) {}
        }

        async function saveMedicalRecord() {
            if(!activePatientName) return;
            try {
                const payload = {
                    clinic_slug: CLINIC_SLUG,
                    patient_name: activePatientName,
                    age: document.getElementById('mAge').value,
                    blood_type: document.getElementById('mBlood').value,
                    allergies: document.getElementById('mAllergy').value,
                    chronic: document.getElementById('mChronic').value,
                    notes: document.getElementById('mNotes').value
                };
                await fetch('https://clinic-server-i00s.onrender.com/api/patient/save', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                showToast('✔️ تم حفظ الملف الطبي للمريض بنجاح', 'success');
            } catch(e) { showToast('خطأ أثناء الحفظ', 'error'); }
        }

        // طباعة الوصفة الطبية بضغطة زر (مع سحب العمر تلقائياً)
        function printPrescription() {
            if(!activePatientName) return showToast('⚠️ يجب مناداة المريض أولاً', 'warning');
            const prescriptionText = document.getElementById('mPrescription').value.trim();
            if(!prescriptionText) return showToast('⚠️ الوصفة فارغة، يرجى كتابة الأدوية أولاً', 'warning');

            const ageText = document.getElementById('mAge').value.trim() || 'غير محدد';
            const dateStr = new Date().toLocaleDateString('ar-DZ');
            const printWindow = window.open('', '', 'width=800,height=600');
            
            printWindow.document.write(`
                <html dir="rtl" lang="ar">
                <head>
                    <title>وصفة طبية - ${activePatientName}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 40px; color: #333; }
                        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #10b981; padding-bottom: 20px; margin-bottom: 30px; }
                        .clinic-info { font-size: 1.2rem; font-weight: bold; color: #10b981; }
                        .date-info { font-size: 1rem; color: #555; }
                        .patient-info { font-size: 1.4rem; font-weight: bold; margin-bottom: 40px; display: flex; justify-content: space-between; background: #f9f9f9; padding: 15px; border-radius: 10px; }
                        .prescription-body { font-size: 1.2rem; line-height: 2; white-space: pre-wrap; min-height: 300px; }
                        .footer { margin-top: 50px; text-align: left; font-size: 1.2rem; font-weight: bold; color: #555; }
                        @media print { @page { size: A5; margin: 10mm; } }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div class="clinic-info">العيادة الطبية<br>${activeDoctorName}</div>
                        <div class="date-info">التاريخ: ${dateStr}</div>
                    </div>
                    
                    <div class="patient-info">
                        <span>المريض: ${activePatientName}</span>
                        <span>العمر: ${ageText}</span>
                    </div>
                    
                    <div class="prescription-body">${prescriptionText}</div>
                    
                    <div class="footer">توقيع الطبيب</div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => { printWindow.print(); printWindow.close(); }, 500);
        }

        async function setStatus(statusType) {
            if(currentNum === 0) return showToast('لا يوجد مريض بالداخل', 'warning');
            try {
                await fetch('https://clinic-server-i00s.onrender.com/api/tickets/status', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: CLINIC_SLUG, ticket_number: currentNum, status: statusType })
                });
                showToast('✔️ تم تسجيل حالة المريض.', 'success');
                document.getElementById('medicalCard').style.display = 'none';
                document.getElementById('currentPatientName').innerText = '--';
                activePatientName = '';
            } catch(e) { showToast('خطأ في الاتصال', 'error'); }
        }

        const socket = io('https://clinic-server-i00s.onrender.com');
        socket.on('new_ticket', (data) => {
            if(data.clinic_slug === CLINIC_SLUG) { fetchStats(); }
        });
    </script>
</body>
</html>
