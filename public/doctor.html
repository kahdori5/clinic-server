<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطبيب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5; display: flex; justify-content: center;
            align-items: center; height: 100vh; margin: 0; text-align: center;
        }
        .container {
            background-color: white; padding: 40px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .number-display {
            font-size: 3rem; color: #dc3545; font-weight: bold; margin: 20px 0;
        }
        button {
            width: 100%; padding: 15px; background-color: #28a745;
            color: white; border: none; border-radius: 8px; font-size: 18px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h2>غرفة الكشف</h2>
        <p>الرقم الحالي بالداخل:</p>
        <div class="number-display" id="currentNumber">--</div>
        <button onclick="callNextPatient()">المناداة على المريض التالي</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // تفعيل التحديث المباشر
        const socket = io('https://clinic-server-i00s.onrender.com');
        
        socket.on('call_patient', (data) => {
            document.getElementById('currentNumber').innerText = data.current_number;
        });

        async function callNextPatient() {
            try {
                // الاتصال بالسيرفر السحابي بالمسار الصحيح
                const response = await fetch('https://clinic-server-i00s.onrender.com/api/call-next', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        clinic_slug: 'default-clinic' // مطلوب في سيرفرك
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // استخراج الرقم من رسالة السيرفر وعرضه
                    alert(data.message);
                } else {
                    alert('تنبيه: ' + (data.message || data.error));
                }
            } catch (error) {
                console.error(error);
                alert('خطأ في الاتصال بالسيرفر.');
            }
        }
    </script>
</body>
</html>
