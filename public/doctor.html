<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطبيب</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 30px auto; }
        h1 { color: #0f172a; }
        .number-display { font-size: 5rem; color: #3b82f6; font-weight: bold; margin: 20px 0; }
        .btn { border: none; padding: 15px 20px; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; margin: 10px; width: 90%; transition: 0.3s; }
        .btn-call { background-color: #3b82f6; color: white; }
        .btn-call:hover { background-color: #2563eb; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        .actions { display: none; /* تظهر فقط بعد مناداة مريض */ }
    </style>
</head>
<body>
    <div class="card">
        <h1>👨‍⚕️ لوحة تحكم الطبيب</h1>
        <p style="color: #64748b;">الرقم الحالي داخل العيادة:</p>
        
        <div class="number-display" id="currentNumberDisplay">0</div>

        <!-- زر مناداة المريض التالي -->
        <button class="btn btn-call" onclick="callNextPatient()">📢 مناداة المريض التالي</button>
        
        <p id="statusMessage" style="color: #ef4444; font-weight: bold;"></p>

        <!-- أزرار إنهاء الكشف أو الغياب -->
        <div class="actions" id="actionButtons">
            <button class="btn btn-success" onclick="updateStatus('completed')">✅ إنهاء الكشف</button>
            <button class="btn btn-danger" onclick="updateStatus('no_show')">❌ المريض لم يحضر</button>
        </div>
    </div>

    <!-- استدعاء مكتبة Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentNumber = 0;

        // دالة مناداة المريض (بديلة لملف test.js)
        async function callNextPatient() {
            try {
                const response = await fetch('/api/call-next', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: 'shifa-clinic' })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('statusMessage').innerText = "";
                } else {
                    // إذا لم يكن هناك مرضى، نعرض الرسالة الحمراء
                    document.getElementById('statusMessage').innerText = data.message || "🛑 لا يوجد مرضى في الانتظار حالياً.";
                    document.getElementById('actionButtons').style.display = 'none';
                }
            } catch (err) {
                alert("خطأ في الاتصال");
            }
        }

        // دالة تحديث حالة المريض (إنهاء أو غياب)
        async function updateStatus(status) {
            if (currentNumber === 0) return;
            try {
                const response = await fetch('/api/tickets/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: 'shifa-clinic', ticket_number: currentNumber, status: status })
                });
                if(response.ok) {
                    alert(status === 'completed' ? "✅ تم إنهاء الكشف بنجاح" : "❌ تم تسجيل المريض كغائب");
                    document.getElementById('actionButtons').style.display = 'none'; // نخفي الأزرار حتى ننادي المريض التالي
                }
            } catch (err) {
                alert("خطأ في تحديث الحالة");
            }
        }

        // الاستماع لتغير الأرقام لتحديث شاشة الطبيب
        socket.on('call_patient', (data) => {
            if (data.clinic_slug === 'shifa-clinic') {
                currentNumber = data.current_number;
                document.getElementById('currentNumberDisplay').innerText = currentNumber;
                document.getElementById('actionButtons').style.display = 'block'; // إظهار أزرار الإنهاء والغياب
            }
        });
    </script>
</body>
</html>
