<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow - Doctor</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --accent: #10b981; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #10b981; --border: #334155; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
        header { display: flex; justify-content: space-between; padding: 15px 30px; border-bottom: 1px solid var(--border); }
        .controls { display: flex; gap: 10px; }
        select, .theme-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 15px; cursor: pointer; }
        .dashboard { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: var(--card); padding: 50px; border-radius: 24px; text-align: center; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .number-display { font-size: 6rem; font-weight: 800; margin: 10px 0 30px; }
        .btn-call { width: 100%; padding: 18px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 800; font-size: 1.2rem;" data-i18n="docTitle">لوحة الطبيب</div>
        <div class="controls">
            <select id="langSelect" onchange="changeLang(this.value)">
                <option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option>
            </select>
            <button class="theme-btn" onclick="toggleTheme()">🌓</button>
        </div>
    </header>
    <div class="dashboard">
        <div class="card">
            <h2 style="margin:0; opacity:0.7;" data-i18n="insideNow">رقم المريض بالداخل</h2>
            <div class="number-display" id="currentNumber">--</div>
            <button class="btn-call" onclick="callNextPatient()" data-i18n="callNext">📢 مناداة المريض التالي</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const dict = {
            ar: { docTitle: "لوحة الطبيب", insideNow: "رقم المريض بالداخل", callNext: "📢 مناداة المريض التالي" },
            fr: { docTitle: "Tableau du médecin", insideNow: "Patient actuel (Numéro)", callNext: "📢 Appeler le suivant" },
            en: { docTitle: "Doctor Dashboard", insideNow: "Current Patient Number", callNext: "📢 Call Next Patient" }
        };
        
        function changeLang(lang) {
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelect').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[lang][el.getAttribute('data-i18n')]);
        }

        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') !== 'dark';
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        window.onload = async () => {
            changeLang(localStorage.getItem('lang') || 'ar');
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/queue-status/default-clinic');
                const data = await res.json();
                document.getElementById('currentNumber').innerText = data.current_number || '--';
            } catch(e) {}
        };

        const socket = io('https://clinic-server-i00s.onrender.com');
        socket.on('call_patient', (data) => { document.getElementById('currentNumber').innerText = data.current_number; });

        async function callNextPatient() {
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/call-next', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: 'default-clinic' })
                });
                const data = await res.json();
                if (res.ok) document.getElementById('currentNumber').innerText = data.message.match(/\d+/)[0];
            } catch (err) { alert('Connection Error'); }
        }
    </script>
</body>
</html>
