<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow - Doctor</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --accent: #10b981; --border: #e2e8f0; --muted: #718096; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #10b981; --border: #334155; --muted: #94a3b8; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
        header { display: flex; justify-content: space-between; padding: 15px 30px; border-bottom: 1px solid var(--border); background: var(--card); align-items: center;}
        .controls { display: flex; gap: 10px; }
        select, .theme-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 15px; cursor: pointer; outline: none; font-family: inherit;}
        .dashboard { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px; }
        .control-card { background: var(--card); padding: 50px; border-radius: 24px; text-align: center; border: 1px solid var(--border); width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);}
        .number-display { font-size: 8rem; font-weight: 800; margin: 20px 0; line-height: 1; color: var(--text); }
        .btn { padding: 18px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; color: white; width: 100%; margin-bottom: 15px; font-family: inherit; transition: 0.2s; }
        .btn:hover { filter: brightness(1.1); }
        .btn-call { background: var(--accent); font-size: 1.3rem; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); }
        .status-btns { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-done { background: #3b82f6; flex: 1; }
        .btn-absent { background: #ef4444; flex: 1; }
        .btn-export { background: #2d3748; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 800; font-size: 1.2rem;">👨‍⚕️ <span data-i18n="docTitle">لوحة الطبيب</span> <span id="clinicNameDisplay" style="color:var(--muted); font-size:1rem;"></span></div>
        <div class="controls">
            <select id="langSelect" onchange="changeLang(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
            <button class="theme-btn" onclick="toggleTheme()">🌓</button>
        </div>
    </header>

    <div class="dashboard">
        <div class="control-card">
            <h2 style="margin:0; opacity:0.7;" data-i18n="insideNow">رقم المريض بالداخل</h2>
            <div class="number-display" id="currentNumber">--</div>
            
            <div class="status-btns">
                <button class="btn btn-done" onclick="setStatus('completed')" data-i18n="btnDone">✔️ تم الكشف</button>
                <button class="btn btn-absent" onclick="setStatus('absent')" data-i18n="btnAbsent">❌ غائب</button>
            </div>
            
            <button class="btn btn-call" onclick="callNextPatient()" data-i18n="callNext">📢 مناداة المريض التالي</button>
            <hr style="border-color: var(--border); margin: 25px 0;">
            <button class="btn btn-export" onclick="exportData()" data-i18n="exportBtn">📊 تحميل تقرير المرضى (Excel)</button>
        </div>
    </div>

    <script>
        const CLINIC_SLUG = new URLSearchParams(window.location.search).get('clinic') || 'default-clinic';
        if(CLINIC_SLUG !== 'default-clinic') document.getElementById('clinicNameDisplay').innerText = `(${CLINIC_SLUG})`;

        const dict = {
            ar: { docTitle: "لوحة الطبيب", insideNow: "رقم المريض بالداخل", callNext: "📢 مناداة المريض التالي", btnDone: "✔️ تم الكشف", btnAbsent: "❌ غائب", exportBtn: "📊 تحميل تقرير المرضى (Excel)", errNoPatient: "لا يوجد مريض حالياً", successStatus: "تم تسجيل الحالة بنجاح!" },
            fr: { docTitle: "Tableau du médecin", insideNow: "Patient Actuel", callNext: "📢 Appeler le suivant", btnDone: "✔️ Terminé", btnAbsent: "❌ Absent", exportBtn: "📊 Télécharger le rapport", errNoPatient: "Aucun patient", successStatus: "Statut enregistré!" },
            en: { docTitle: "Doctor Dashboard", insideNow: "Current Patient", callNext: "📢 Call Next Patient", btnDone: "✔️ Completed", btnAbsent: "❌ Absent", exportBtn: "📊 Download Report (Excel)", errNoPatient: "No patient currently", successStatus: "Status saved successfully!" }
        };
        
        let currentLang = 'ar';
        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang); 
            document.documentElement.lang = lang; 
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelect').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[lang][el.getAttribute('data-i18n')]);
        }

        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') !== 'dark';
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        let currentNum = 0;
        
        window.onload = async () => {
            changeLang(localStorage.getItem('lang') || 'ar');
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            
            try {
                const res = await fetch(`https://clinic-server-i00s.onrender.com/api/queue-status/${CLINIC_SLUG}`);
                const data = await res.json();
                currentNum = data.current_number || 0;
                document.getElementById('currentNumber').innerText = currentNum === 0 ? '--' : currentNum;
            } catch(e) {}
        };

        async function callNextPatient() {
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/call-next', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: CLINIC_SLUG })
                });
                const data = await res.json();
                if (res.ok) {
                    currentNum = parseInt(data.message.match(/\d+/)[0]);
                    document.getElementById('currentNumber').innerText = currentNum;
                } else { alert(data.message); }
            } catch(e) { alert("خطأ اتصال"); }
        }

        async function setStatus(statusType) {
            if(currentNum === 0) return alert(dict[currentLang].errNoPatient);
            try {
                await fetch('https://clinic-server-i00s.onrender.com/api/tickets/status', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: CLINIC_SLUG, ticket_number: currentNum, status: statusType })
                });
                alert(dict[currentLang].successStatus);
            } catch(e) { alert("خطأ اتصال"); }
        }

        function exportData() {
            window.location.href = `https://clinic-server-i00s.onrender.com/api/export/${CLINIC_SLUG}`;
        }
    </script>
</body>
</html>
