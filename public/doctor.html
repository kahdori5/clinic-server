<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الطبيب - ClinicFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6; --card-bg: #ffffff; --text-main: #2d3748; 
            --text-muted: #718096; --accent: #10b981; --border: #e2e8f0;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; 
            --text-muted: #94a3b8; --accent: #10b981; --border: #334155;
        }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
        header { display: flex; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid var(--border); background: var(--card-bg); }
        .theme-toggle { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-family: inherit; }
        .dashboard { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .control-card { background: var(--card-bg); padding: 50px; border-radius: 24px; text-align: center; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .status-badge { display: inline-block; padding: 5px 15px; background: rgba(16, 185, 129, 0.1); color: var(--accent); border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 20px; }
        .number-display { font-size: 6rem; font-weight: 800; color: var(--text-main); margin: 10px 0 30px; line-height: 1; }
        .btn-call { width: 100%; padding: 18px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; font-family: inherit; transition: 0.3s; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); }
        .btn-call:hover { transform: translateY(-2px); opacity: 0.9; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 800; font-size: 1.2rem;">👨‍⚕️ لوحة الطبيب</div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </header>
    <div class="dashboard">
        <div class="control-card">
            <div class="status-badge">العيادة مفتوحة</div>
            <h2 style="margin: 0; color: var(--text-muted);">رقم المريض بالداخل</h2>
            <div class="number-display" id="currentNumber">--</div>
            <button class="btn-call" onclick="callNextPatient()">📢 مناداة المريض التالي</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };
        if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

        const socket = io('https://clinic-server-i00s.onrender.com');
        socket.on('call_patient', (data) => { document.getElementById('currentNumber').innerText = data.current_number; });

        async function callNextPatient() {
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/call-next', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: 'default-clinic' })
                });
                const data = await res.json();
                if (res.ok) {
                    const match = data.message.match(/\d+/);
                    if(match) document.getElementById('currentNumber').innerText = match[0];
                } else alert('تنبيه: ' + (data.message || data.error));
            } catch (err) { alert('خطأ في الاتصال بالسيرفر.'); }
        }
    </script>
</body>
</html>
