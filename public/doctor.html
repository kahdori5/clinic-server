<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow - Doctor</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --accent: #10b981; --border: #e2e8f0; --muted: #718096; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #10b981; --border: #334155; --muted: #94a3b8; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
        header { display: flex; justify-content: space-between; padding: 15px 30px; border-bottom: 1px solid var(--border); background: var(--card); }
        .controls { display: flex; gap: 10px; }
        select, .theme-btn, .refresh-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 15px; cursor: pointer; outline: none; font-family: inherit;}
        
        .dashboard { flex: 1; display: flex; flex-wrap: wrap; gap: 30px; padding: 30px; justify-content: center; align-items: flex-start; }
        
        /* بطاقة التحكم الرئيسية */
        .control-card { background: var(--card); padding: 50px; border-radius: 24px; text-align: center; flex: 1; min-width: 300px; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .number-display { font-size: 7rem; font-weight: 800; margin: 10px 0 30px; color: var(--text); line-height: 1; }
        .btn-call { width: 100%; padding: 20px; background: var(--accent); color: white; border: none; border-radius: 15px; font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); }
        .btn-call:hover { transform: translateY(-3px); }
        
        /* قسم الإحصائيات */
        .stats-section { flex: 1; min-width: 300px; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-box { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .stat-box span { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 5px; }
        .stat-box strong { font-size: 2rem; color: var(--accent); }
        
        .breakdown-card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); flex: 1; }
        .breakdown-card h3 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between;}
        .day-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed var(--border); font-size: 0.95rem; }
        .day-row:last-child { border-bottom: none; }
        .day-date { color: var(--muted); }
        .day-count { font-weight: bold; background: rgba(16, 185, 129, 0.1); color: var(--accent); padding: 2px 10px; border-radius: 10px; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;">
            👨‍⚕️ <span data-i18n="docTitle">لوحة الطبيب</span>
        </div>
        <div class="controls">
            <button class="refresh-btn" onclick="fetchStats()" data-i18n="refresh">🔄 تحديث</button>
            <select id="langSelect" onchange="changeLang(this.value)">
                <option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option>
            </select>
            <button class="theme-btn" onclick="toggleTheme()">🌓</button>
        </div>
    </header>

    <div class="dashboard">
        <!-- لوحة التحكم بالمناداة -->
        <div class="control-card">
            <h2 style="margin:0; opacity:0.7; font-size: 1.2rem;" data-i18n="insideNow">رقم المريض بالداخل</h2>
            <div class="number-display" id="currentNumber">--</div>
            <button class="btn-call" onclick="callNextPatient()" data-i18n="callNext">📢 مناداة المريض التالي</button>
        </div>

        <!-- لوحة الإحصائيات -->
        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-box">
                    <span data-i18n="totalToday">إجمالي اليوم</span>
                    <strong id="statToday">0</strong>
                </div>
                <div class="stat-box">
                    <span data-i18n="waitingNow">في الانتظار حالياً</span>
                    <strong id="statWaiting" style="color: #ea7c69;">0</strong>
                </div>
                <div class="stat-box" style="grid-column: span 2;">
                    <span data-i18n="totalWeek">إجمالي الأسبوع (آخر 7 أيام)</span>
                    <strong id="statWeek" style="color: #3b82f6;">0</strong>
                </div>
            </div>

            <div class="breakdown-card">
                <h3 data-i18n="dailyBreakdown">تفصيل الأيام السابقة</h3>
                <div id="breakdownList">
                    <!-- سيتم تعبئة الأيام هنا برمجياً -->
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const dict = {
            ar: { docTitle: "لوحة الطبيب", insideNow: "رقم المريض بالداخل", callNext: "📢 مناداة المريض التالي", totalToday: "سجلوا اليوم", waitingNow: "في الانتظار حالياً", totalWeek: "إجمالي الأسبوع", dailyBreakdown: "سجل آخر 7 أيام", refresh: "🔄 تحديث" },
            fr: { docTitle: "Tableau du médecin", insideNow: "Patient actuel", callNext: "📢 Appeler le suivant", totalToday: "Aujourd'hui", waitingNow: "En attente", totalWeek: "Total de la semaine", dailyBreakdown: "Historique (7 jours)", refresh: "🔄 Actualiser" },
            en: { docTitle: "Doctor Dashboard", insideNow: "Current Patient", callNext: "📢 Call Next Patient", totalToday: "Today's Total", waitingNow: "Currently Waiting", totalWeek: "This Week's Total", dailyBreakdown: "Last 7 Days Record", refresh: "🔄 Refresh" }
        };
        
        function changeLang(lang) {
            localStorage.setItem('lang', lang); document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelect').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[lang][el.getAttribute('data-i18n')]);
            fetchStats(); // لتحديث صيغة التواريخ
        }

        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') !== 'dark';
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        const socket = io('https://clinic-server-i00s.onrender.com');
        socket.on('call_patient', (data) => { 
            document.getElementById('currentNumber').innerText = data.current_number;
            fetchStats(); // تحديث الإحصائيات عند مناداة مريض جديد
        });
        socket.on('new_ticket', () => { fetchStats(); }); // تحديث فور سحب أي مريض لتذكرة جديدة

        window.onload = async () => {
            changeLang(localStorage.getItem('lang') || 'ar');
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            
            // جلب الرقم الحالي
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/queue-status/default-clinic');
                const data = await res.json();
                document.getElementById('currentNumber').innerText = data.current_number || '--';
            } catch(e) {}
            
            fetchStats();
        };

        async function fetchStats() {
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/stats/default-clinic');
                const data = await res.json();
                
                document.getElementById('statToday').innerText = data.today;
                document.getElementById('statWaiting').innerText = data.today - (document.getElementById('currentNumber').innerText === '--' ? 0 : document.getElementById('currentNumber').innerText); // حساب تقريبي للمنتظرين
                document.getElementById('statWeek').innerText = data.week;

                const list = document.getElementById('breakdownList');
                list.innerHTML = '';
                if(data.breakdown.length === 0) list.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--muted);">لا توجد بيانات سابقة</div>`;
                
                const lang = localStorage.getItem('lang') || 'ar';
                data.breakdown.forEach(day => {
                    const dateObj = new Date(day.date);
                    const formattedDate = dateObj.toLocaleDateString(lang === 'ar' ? 'ar-EG' : lang === 'fr' ? 'fr-FR' : 'en-US', { weekday: 'long', month: 'short', day: 'numeric' });
                    
                    list.innerHTML += `
                        <div class="day-row">
                            <span class="day-date">${formattedDate}</span>
                            <span class="day-count">${day.count} ${lang === 'ar' ? 'مرضى' : lang === 'fr' ? 'Patients' : 'Patients'}</span>
                        </div>
                    `;
                });
            } catch(e) { console.error("Error fetching stats"); }
        }

        async function callNextPatient() {
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/call-next', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: 'default-clinic' })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('currentNumber').innerText = data.message.match(/\d+/)[0];
                    fetchStats();
                }
            } catch (err) { alert('Connection Error'); }
        }
    </script>
</body>
</html>
