<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow - Patient</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --muted: #718096; --accent: #40757d; --btn: #ea7c69; --border: #e2e8f0; --success: #10b981; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --btn: #ea7c69; --border: #334155; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
        header { display: flex; justify-content: space-between; padding: 15px 30px; align-items: center; }
        .controls { display: flex; gap: 10px; }
        select, .theme-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 15px; cursor: pointer; font-family: inherit; outline: none; }
        .main-container { display: flex; flex-wrap: wrap-reverse; justify-content: center; gap: 40px; padding: 20px; flex: 1; align-items: center; }
        .card { background: var(--card); padding: 35px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        h2 { text-align: center; margin-top: 0; }
        .live-stats { display: flex; justify-content: space-between; background: rgba(64,117,125,0.1); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid var(--accent); }
        .stat-box { text-align: center; flex: 1; }
        .stat-box span { display: block; font-size: 0.85rem; color: var(--muted); }
        .stat-box strong { font-size: 1.8rem; color: var(--accent); }
        input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); font-family: inherit; margin-bottom: 20px; box-sizing: border-box; }
        button.submit { width: 100%; padding: 15px; background: var(--btn); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        #tracking-section { display: none; text-align: center; }
        .my-num { font-size: 4rem; color: var(--btn); font-weight: bold; margin: 20px 0; }
        .alert { display: none; background: var(--success); color: white; padding: 15px; border-radius: 12px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 800; font-size: 1.2rem;">ClinicFlow</div>
        <div class="controls">
            <select id="langSelect" onchange="changeLang(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
            <button class="theme-btn" onclick="toggleTheme()">🌓</button>
        </div>
    </header>
    <div class="main-container">
        <!-- قسم الحجز -->
        <div class="card" id="booking-section">
            <h2 data-i18n="takeTicket">خذ رقم انتظارك</h2>
            <div class="live-stats">
                <div class="stat-box">
                    <span data-i18n="currentDoc">عند الطبيب الآن</span>
                    <strong id="preCurrent">--</strong>
                </div>
                <div class="stat-box" style="border-inline-start: 1px solid var(--border);">
                    <span data-i18n="peopleAhead">ينتظرون قبلك</span>
                    <strong id="preAhead">--</strong>
                </div>
            </div>
            <input type="text" id="patientName" data-i18n-ph="namePh" placeholder="الاسم الذي نناديك به..." required>
            <button class="submit" onclick="drawTicket()" data-i18n="joinBtn">انضم إلى الدور</button>
        </div>

        <!-- قسم التتبع -->
        <div class="card" id="tracking-section">
            <h2 data-i18n="trackTitle">تتبع دورك مباشرة</h2>
            <span data-i18n="yourNum">رقمك هو:</span>
            <div class="my-num" id="myTicketNumber">--</div>
            <div class="stat-box" style="margin-bottom: 20px;">
                <span data-i18n="currentDoc">الرقم عند الطبيب الآن</span>
                <strong id="liveCurrentNumber" style="font-size: 2.5rem;">--</strong>
            </div>
            <div class="alert" id="turnAlert" data-i18n="turnAlert">🔔 دورك الآن، تفضل بالدخول!</div>
            
            <!-- زر إضافي اختياري لمسح التذكرة إذا أراد المريض المغادرة -->
            <button onclick="clearMyTicket()" style="background: transparent; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; margin-top: 15px; font-family: inherit;" data-i18n="cancelTicket">إلغاء تذكرتي والعودة</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const dict = {
            ar: { takeTicket: "خذ رقم انتظارك", currentDoc: "عند الطبيب الآن", peopleAhead: "ينتظرون قبلك", namePh: "الاسم الذي نناديك به...", joinBtn: "انضم إلى الدور", trackTitle: "تتبع دورك مباشرة", yourNum: "رقم تذكرتك:", turnAlert: "🔔 دورك الآن، تفضل بالدخول!", cancelTicket: "الخروج وإلغاء تذكرتي" },
            fr: { takeTicket: "Prenez votre ticket", currentDoc: "Actuellement chez le médecin", peopleAhead: "Personnes avant vous", namePh: "Votre nom...", joinBtn: "Rejoindre la file", trackTitle: "Suivez votre tour", yourNum: "Votre numéro:", turnAlert: "🔔 C'est votre tour, entrez!", cancelTicket: "Annuler mon ticket" },
            en: { takeTicket: "Take your ticket", currentDoc: "Currently at doctor", peopleAhead: "People ahead of you", namePh: "Your name...", joinBtn: "Join the queue", trackTitle: "Track your turn", yourNum: "Your ticket number:", turnAlert: "🔔 It's your turn, please enter!", cancelTicket: "Cancel my ticket" }
        };

        let myNumber = 0;
        const socket = io('https://clinic-server-i00s.onrender.com');

        function changeLang(lang) {
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelect').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[lang][el.getAttribute('data-i18n')]);
            document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = dict[lang][el.getAttribute('data-i18n-ph')]);
        }
        
        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') !== 'dark';
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        window.onload = async () => {
            changeLang(localStorage.getItem('lang') || 'ar');
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/queue-status/default-clinic');
                const data = await res.json();
                const currentDocNum = data.current_number || 0;
                const lastIssued = data.last_issued_number || 0;

                document.getElementById('preCurrent').innerText = currentDocNum;
                let ahead = lastIssued - currentDocNum;
                document.getElementById('preAhead').innerText = ahead > 0 ? ahead : 0;

                // --- الميزة الذكية: التحقق من التذكرة المحفوظة في هاتف المريض ---
                const savedDate = localStorage.getItem('ticketDate');
                const todayDate = new Date().toDateString();

                if (savedDate === todayDate && localStorage.getItem('myTicketNumber')) {
                    // المريض لديه تذكرة من اليوم! انقله فوراً لشاشة التتبع
                    myNumber = parseInt(localStorage.getItem('myTicketNumber'));
                    document.getElementById('myTicketNumber').innerText = myNumber;
                    document.getElementById('liveCurrentNumber').innerText = currentDocNum;
                    
                    document.getElementById('booking-section').style.display = 'none';
                    document.getElementById('tracking-section').style.display = 'block';

                    checkIfMyTurn(currentDocNum); // التحقق ربما يكون دوره قد حان بينما كان المتصفح مغلقاً
                } else if (savedDate !== todayDate) {
                    // يوم جديد: قم بتنظيف ذاكرة الهاتف من التذكرة القديمة
                    localStorage.removeItem('myTicketNumber');
                    localStorage.removeItem('ticketDate');
                }

            } catch(e) {}
        };

        function checkIfMyTurn(currentNum) {
            // إذا كان الرقم الحالي يساوي أو تجاوز رقم المريض
            if (currentNum >= myNumber && myNumber > 0) {
                document.getElementById('turnAlert').style.display = 'block';
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            }
        }

        async function drawTicket() {
            const name = document.getElementById('patientName').value.trim();
            if (!name) return;
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/tickets', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: 'default-clinic', patient_name: name })
                });
                const data = await res.json();
                if (res.ok) {
                    myNumber = parseInt(data.message.match(/\d+/)[0]);
                    
                    // --- حفظ التذكرة في ذاكرة الهاتف ---
                    localStorage.setItem('myTicketNumber', myNumber);
                    localStorage.setItem('ticketDate', new Date().toDateString());

                    document.getElementById('myTicketNumber').innerText = myNumber;
                    document.getElementById('liveCurrentNumber').innerText = document.getElementById('preCurrent').innerText;
                    document.getElementById('booking-section').style.display = 'none';
                    document.getElementById('tracking-section').style.display = 'block';
                }
            } catch (err) { alert('Connection error'); }
        }

        function clearMyTicket() {
            // خيار إضافي: إذا ضغط المريض على "إلغاء التذكرة" يتم مسحها من جهازه والعودة للشاشة الأولى
            if(confirm('هل أنت متأكد أنك تريد مسح تذكرتك من هاتفك؟')) {
                localStorage.removeItem('myTicketNumber');
                localStorage.removeItem('ticketDate');
                location.reload(); // إعادة تحميل الصفحة
            }
        }

        socket.on('call_patient', (data) => {
            const currentNum = parseInt(data.current_number);
            document.getElementById('liveCurrentNumber').innerText = currentNum;
            document.getElementById('preCurrent').innerText = currentNum;
            
            // تحديث عدد المنتظرين في واجهة الحجز
            let ahead = lastIssued - currentNum;
            document.getElementById('preAhead').innerText = ahead > 0 ? ahead : 0;

            checkIfMyTurn(currentNum);
        });
        
        socket.on('new_ticket', (data) => {
            let current = parseInt(document.getElementById('preCurrent').innerText) || 0;
            let ahead = data.ticket_number - current;
            document.getElementById('preAhead').innerText = ahead > 0 ? ahead : 0;
            // تحديث المتغير المحلي
            lastIssued = data.ticket_number; 
        });
    </script>
</body>
</html>
