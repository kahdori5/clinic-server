<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحب تذكرة مريض</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        h2 { color: #333; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h2>الرجاء إدخال اسمك لسحب تذكرة الانتظار</h2>
        <input type="text" id="patientName" placeholder="اكتب اسمك هنا...">
        <button onclick="drawTicket()">سحب تذكرة الآن</button>
    </div>

    <script>
        async function drawTicket() {
            const nameInput = document.getElementById('patientName');
            const name = nameInput.value.trim();
            
            if (!name) {
                alert('الرجاء كتابة اسمك أولاً!');
                return;
            }

            try {
                // إرسال الطلب للسيرفر السحابي مباشرة
                const response = await fetch('https://clinic-server-i00s.onrender.com/ticket', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                });

                if (response.ok) {
                    alert('تم سحب التذكرة بنجاح! تفضل بالانتظار.');
                    nameInput.value = ''; // تفريغ الحقل بعد النجاح
                } else {
                    alert('حدث خطأ أثناء تسجيل التذكرة، يرجى المحاولة مجدداً.');
                }
            } catch (error) {
                console.error(error);
                alert('خطأ في الاتصال بالسيرفر. يرجى التأكد من الإنترنت.');
            }
        }
    </script>
</body>
</html>
