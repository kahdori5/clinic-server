<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز تذكرة - عيادة الأمل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6; --card-bg: #ffffff; --text-main: #2d3748; 
            --text-muted: #718096; --accent: #40757d; --btn-bg: #ea7c69; 
            --border: #e2e8f0;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; 
            --text-muted: #94a3b8; --accent: #38bdf8; --btn-bg: #ea7c69; 
            --border: #334155;
        }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
        header { display: flex; justify-content: space-between; padding: 20px 40px; align-items: center; }
        .theme-toggle { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-family: inherit; transition: 0.3s; }
        .main-container { display: flex; flex-wrap: wrap-reverse; justify-content: center; gap: 50px; padding: 40px; align-items: center; flex: 1; }
        .booking-card { background: var(--card-bg); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); transition: 0.3s; }
        .booking-card h2 { margin: 0 0 5px; font-size: 1.8rem; text-align: center; }
        .booking-card p.subtitle { text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 30px; }
        .doc-item { padding: 15px; border: 2px solid var(--accent); border-radius: 12px; margin-bottom: 25px; background: rgba(64,117,125,0.05); }
        .doc-item strong { display: block; font-size: 1.1rem; }
        input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-color); color: var(--text-main); font-family: inherit; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        .submit-btn { width: 100%; padding: 16px; background: var(--btn-bg); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; font-family: inherit; transition: 0.3s; }
        .submit-btn:hover { opacity: 0.9; }
        .text-content { max-width: 500px; }
        .text-content h1 { font-size: 3.5rem; margin: 0 0 10px; line-height: 1.2; }
        .text-content p { font-size: 1.1rem; color: var(--text-muted); line-height: 1.6; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 800; font-size: 1.2rem;">ClinicFlow <span style="color:var(--btn-bg)">♥</span></div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 الوضع الليلي</button>
    </header>
    <div class="main-container">
        <div class="booking-card">
            <h2>خذ رقم انتظارك</h2>
            <p class="subtitle">خطوتان بسيطتان وتكون في الدور.</p>
            <div class="doc-item">
                <strong>د. الطبيب العام</strong>
                <span style="font-size: 0.85rem; color: var(--text-muted);">طب عام • متاح الآن</span>
            </div>
            <input type="text" id="patientName" placeholder="الاسم الذي نناديك به..." required>
            <button class="submit-btn" onclick="drawTicket()">انضم إلى الدور &larr;</button>
        </div>
        <div class="text-content">
            <h1>عيادة الأمل الطبية<br><span style="color: var(--accent);">انتظارك صار أوضح.</span></h1>
            <p>اختر طبيبك وخذ رقمك. نخبرك بمن تتم معاينته وعدد المراجعين قبلك — بلا تخمين للوقت.</p>
        </div>
    </div>
    <script>
        // نظام الوضع الليلي
        const toggleTheme = () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };
        if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

        // سحب التذكرة
        async function drawTicket() {
            const nameInput = document.getElementById('patientName');
            const name = nameInput.value.trim();
            const btn = document.querySelector('.submit-btn');
            if (!name) return alert('الرجاء كتابة اسمك!');
            btn.innerHTML = 'جاري السحب...'; btn.disabled = true;
            try {
                const res = await fetch('https://clinic-server-i00s.onrender.com/api/tickets', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clinic_slug: 'default-clinic', patient_name: name })
                });
                const data = await res.json();
                if (res.ok) { alert('تم السحب! ' + data.message); nameInput.value = ''; } 
                else alert('خطأ: ' + (data.error || data.message));
            } catch (err) { alert('خطأ في الاتصال بالسيرفر.'); }
            btn.innerHTML = 'انضم إلى الدور &larr;'; btn.disabled = false;
        }
    </script>
</body>
</html>
